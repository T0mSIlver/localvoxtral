name: Stress unit shards (#1084, temporary)

# Temporary: reruns build-test's unit step back to back on hosted macOS to
# reproduce #1084 and to prove its fix. Deleted before the PR merges.
on:
  push:
    branches: [claude/project-thread-8xc8rr]

permissions:
  contents: read

concurrency:
  group: stress-unit-shards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress:
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        runner: [a, b]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Record hosted toolchain
        id: hosted_toolchain
        run: |
          swift --version
          SLUG="$(swift --version | head -1 | tr -cs 'a-zA-Z0-9.' '-' | cut -c1-48)"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM build cache
        id: build_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.hosted_toolchain.outputs.slug }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.hosted_toolchain.outputs.slug }}-${{ hashFiles('Package.resolved') }}-

      - name: Restore tracked-file mtimes from git
        env:
          MATCHED_KEY: ${{ steps.build_cache.outputs.cache-matched-key }}
        run: |
          CACHE_BASE=""
          if [[ "$MATCHED_KEY" =~ -([0-9a-f]{40})$ ]]; then
            CACHE_BASE="${BASH_REMATCH[1]}"
          fi
          ./scripts/ci/restore-mtimes.sh . "$CACHE_BASE"

      - name: Unit step, back to back
        run: |
          set -uo pipefail
          failed=0
          for i in $(seq 1 12); do
            log="$RUNNER_TEMP/unit-$i.log"
            status=0
            NSUnbufferedIO=YES ./scripts/ci/run-supervised-command.sh \
              900 "$log" -- \
              ./scripts/ci/run-unit-shards.sh --coverage "$(sysctl -n hw.ncpu)" \
              RealtimeAPIVLLMIntegrationTests \
              SpeechHelperIntegrationTests \
              AgentDictationE2EEvalTests \
              HerdrIntegrationTests \
              PolishContextPreparationTests >"$RUNNER_TEMP/supervisor-$i.out" 2>&1 || status=$?
            echo "=== run $i: exit $status"
            grep -E '^==> (Shard [0-9]+:|Shard exits|Shard [0-9]+/[0-9]+: exit|Unit shards|Coverage|FAILED|--coverage)' "$log" || true
            if (( status != 0 )); then
              failed=$((failed + 1))
              echo "--- supervisor output before its tail:"
              sed -n '1,/final log output:/p' "$RUNNER_TEMP/supervisor-$i.out"
              echo "--- log lines with error or signal:"
              grep -nE 'error: |Terminated|signal|stopped by' "$log" | head -40 || true
            fi
          done
          echo "=== $failed of 12 runs failed"
          (( failed == 0 ))

      - name: Upload the runs' logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stress-unit-logs-${{ matrix.runner }}
          path: ${{ runner.temp }}/unit-*.log
          retention-days: 7
