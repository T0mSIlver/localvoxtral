name: CodeQL

# Workflow analysis only. This repo is public and one job runs on the owner's
# machine with the signing identity and the login keychain, so an injectable
# `${{ }}` expression or an over-scoped token in a workflow is the expensive
# mistake here. Ubuntu, seconds, and NEVER the self-hosted Mac (#418).
#
# There is no Swift job: its first run (PR #470) hung inside a traced
# `swift build` that takes about 3 minutes untraced, and GitHub kept no log.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  schedule:
    # Mondays, 06:23 UTC. Off the hour — GitHub drops scheduled runs that pile
    # up on a round number. The weekly run catches new queries against
    # workflows nobody has touched.
    - cron: '23 6 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  actions:
    name: Analyse workflows
    # A fork PR's token cannot write security events, so the upload would fail
    # on a contributor's PR. Workflow changes from a fork land on main and get
    # analysed by the push run.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: actions
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:actions

