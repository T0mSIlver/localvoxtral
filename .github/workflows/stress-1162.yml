name: Stress 1162

# TEMPORARY (#1162): runs the sharded unit suite over and over on hosted
# macOS, as build-test does, and prints any xctest crash report into the log. Deleted before the
# PR that adds it is marked ready.

on:
  pull_request:
    paths:
      - .github/workflows/stress-1162.yml
      - Tests/localvoxtralTests/OverlayDestinationClickTests.swift
      - Sources/localvoxtral/DictationOverlayController.swift
      - Sources/localvoxtral/DictationOverlayView.swift

concurrency:
  group: stress-1162-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stress:
    runs-on: macos-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        mode: [deliberate-crash]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Record hosted toolchain
        id: hosted_toolchain
        run: |
          SLUG="$(swift --version | head -1 | tr -cs 'a-zA-Z0-9.' '-' | cut -c1-48)"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM build cache
        id: build_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.hosted_toolchain.outputs.slug }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.hosted_toolchain.outputs.slug }}-${{ hashFiles('Package.resolved') }}-
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.hosted_toolchain.outputs.slug }}-

      - name: Restore tracked-file mtimes from git
        env:
          MATCHED_KEY: ${{ steps.build_cache.outputs.cache-matched-key }}
        run: |
          CACHE_BASE=""
          if [[ "$MATCHED_KEY" =~ -([0-9a-f]{40})$ ]]; then
            CACHE_BASE="${BASH_REMATCH[1]}"
          fi
          ./scripts/ci/restore-mtimes.sh . "$CACHE_BASE"

      - name: Build tests
        run: swift build --build-system native --build-tests --enable-code-coverage 2>&1 | tail -n 5

      - name: Screen and mouse
        run: |
          osascript -l JavaScript -e 'ObjC.import("AppKit"); var m = $.NSEvent.mouseLocation; var s = $.NSScreen.mainScreen.frame; "mouse=" + m.x + "," + m.y + " screen=" + s.size.width + "x" + s.size.height' || true

      - name: Crash an xctest on purpose
        run: |
          BUNDLE="$(find .build -maxdepth 3 -type d -name localvoxtralPackageTests.xctest | head -n 1)"
          LV_STRESS_CRASH=1 NSUnbufferedIO=YES xcrun xctest \
            -XCTest localvoxtralTests.OverlayControllerChurnStressTests/testDeliberateSegfault "$BUNDLE" \
            > "$RUNNER_TEMP/crash.log" 2>&1
          echo "xctest exited $?"
          tail -n 3 "$RUNNER_TEMP/crash.log"

      - name: Summarize it the way build-test does
        run: ./scripts/ci/xctest-crash-summary.py --wait 30
