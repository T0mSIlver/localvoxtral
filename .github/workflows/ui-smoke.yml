name: UI Smoke

on:
  workflow_dispatch:
    inputs:
      drill_only:
        # A change to the drill alone needs no dictation, and the dictation
        # job takes the owner's Mac.
        description: Run only the hosted AX drill, not the Mac's e2e dictation
        type: boolean
        default: false
  # No schedule (owner, 2026-09-26). The e2e dictation needs the owner's
  # Mac unlocked and idle, and GitHub cron starts up to an hour late, so the
  # old evening slots took the Mac at unpredictable times. The owner starts a
  # run on main himself when the Mac is free (the GitHub app's "Run workflow"
  # button, or `gh workflow run ui-smoke.yml`); release.yml's daily release
  # ships the newest main commit such a run scored.
  # UI-affecting PRs get automated proof on demand: add the needs-ui-smoke
  # label (re-add it to rerun after new pushes). Both jobs run.
  pull_request:
    types: [labeled]

concurrency:
  group: ui-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The AX drill (scripts/ui-smoke.sh) on a GitHub-hosted runner (#573): it
  # forces External URL mode, starts no dictation and has polishing off, so it
  # needs no API key, microphone, Metal or backend, and reaches no server. The
  # hosted image pre-grants Accessibility and Screen Recording to bash and
  # osascript, which is what the drill's TCC preflight and System Events calls
  # run as. It needs no unlocked Mac and no fork check: a hosted runner never
  # sees the owner's machine.
  ax-drill:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'needs-ui-smoke')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags so package_app.sh can git-describe the version.
          fetch-depth: 0

      - name: Record runner
        # About 30 % of hosted macOS runners have no audio device. The drill
        # must not depend on one; this line says which kind a red run had.
        run: |
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"
          if system_profiler SPAudioDataType 2>/dev/null | grep -q 'Input Channels'; then
            echo "Audio input device: present" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Audio input device: none" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Package app bundle
        # Ad-hoc signed and without the MLX helpers, like build-test's fork-PR
        # bundle: the signing identity lives in the owner's keychain and the
        # image has no MetalToolchain. The drill runs in External URL mode, so
        # it launches neither helper.
        env:
          LOCALVOXTRAL_SKIP_POLISHD: "1"
          LOCALVOXTRAL_SKIP_SPEECHD: "1"
          LOCALVOXTRAL_REQUIRE_CODESIGN_IDENTITY: "0"
        run: ./scripts/package_app.sh release

      - name: Run AX UI smoke
        env:
          # The ad-hoc bundle has no Team ID, so its first login-keychain read
          # would raise the ACL prompt. The drill needs no API key.
          LOCALVOXTRAL_DISABLE_LOGIN_KEYCHAIN: "1"
        run: |
          # Launch a copy from outside the workspace with .build hidden, as
          # build-test's launch smoke does: a same-tree launch passes even when
          # the binary's resource lookup depends on the builder's .build path,
          # which crashes on every other machine (#87).
          SMOKE_DIR="$(mktemp -d "$RUNNER_TEMP/ui-smoke.XXXXXX")"
          ditto dist/localvoxtral.app "$SMOKE_DIR/localvoxtral.app"
          mv .build .build.smoke-hidden
          trap 'mv .build.smoke-hidden .build' EXIT
          mkdir -p logs
          set -o pipefail
          ./scripts/ui-smoke.sh "$SMOKE_DIR/localvoxtral.app" 2>&1 | tee logs/ui-smoke.log

      - name: Capture the screen
        if: failure()
        run: |
          mkdir -p logs
          screencapture -x logs/ui-smoke-screen.png || true

      - name: Upload UI smoke log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-smoke-log
          path: |
            logs/ui-smoke.log
            logs/ui-smoke-screen.png
          if-no-files-found: ignore
          retention-days: 14

  # The e2e dictation check stays on the owner's Mac: it needs the STT server,
  # the Accessibility grant of the signed bundle and an unlocked GUI session.
  e2e-dictation:
    # Same security invariant as ci.yml: fork PRs must never reach the
    # self-hosted runner, label or no label.
    if: >-
      (github.event_name == 'workflow_dispatch' && !inputs.drill_only) ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'needs-ui-smoke' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 25
    env:
      # The owner's own dispatch on main, from his phone or a shell, is the
      # run the daily release depends on. It is guarded: on battery or a
      # locked screen it skips green instead of taking the Mac at a bad
      # moment. Branch dispatches (scripts/ui-smoke-dispatch.sh) and the
      # label are a PR asking for a result and always run.
      GUARDED: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep gitignored build state between runs on the persistent
          # self-hosted runner (same rationale as ci.yml/eval-e2e.yml). The
          # workspace is shared with ci.yml, so the default `git clean -ffdx`
          # here wiped .build and both helper DerivedData trees every night —
          # the first CI run each morning then paid ~7 min of cold MLX C++ +
          # Metal helper rebuilds (observed run 29763957545, 2026-07-20).
          clean: false

      - name: Decide whether this dispatch on main runs (power + lock probes)
        # The decision logic lives in scripts/ci/ui-smoke-guard.sh (kept out
        # of the workflow so it is testable — test-ui-smoke-guard.sh runs in
        # ci.yml's shell-test step); it fails OPEN on probe errors so a
        # broken probe can never silently disable the lane.
        id: guard
        if: env.GUARDED == 'true'
        run: |
          set -euo pipefail
          DECISION="$(./scripts/ci/ui-smoke-guard.sh)"
          echo "$DECISION" >> "$GITHUB_OUTPUT"
          REASON="$(sed -n 's/^reason=//p' <<<"$DECISION")"
          if [[ "$(sed -n 's/^run=//p' <<<"$DECISION")" == "true" ]]; then
            echo "E2E dictation: RUNNING ($REASON)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "E2E dictation: SKIPPED ($REASON)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Clean stale outputs (keep build caches)
        # Shared repair-and-clean for the persistent workspace (see the
        # script for the removal list and .build.smoke-hidden rationale).
        #
        # The guard condition compares `!= 'false'` (not `== 'true'`) so a
        # missing output fails OPEN: if the guard ever exits 0 without
        # emitting run=..., the dictation runs rather than every slot
        # silently skipping green forever. Same condition on the steps below.
        if: steps.guard.outputs.run != 'false'
        run: ./scripts/ci/clean-stale-outputs.sh

      - name: Package the e2e harness app bundle (dictates from a file)
        # The e2e dictation check needs the test harness: the control socket
        # and the WAV that stands in for the microphone (docs/test-harness.md).
        # No release build has either; this is the one package that asks.
        # Its own bundle id gives it its own Accessibility row, so the
        # owner's ad-hoc release and this build stop taking the grant from
        # each other (#1198).
        id: package
        if: steps.guard.outputs.run != 'false'
        env:
          LOCALVOXTRAL_CODESIGN_IDENTITY: localvoxtral-dev
          LOCALVOXTRAL_E2E_HARNESS: "1"
          LOCALVOXTRAL_BUNDLE_ID: com.localvoxtral.e2e-harness
        run: ./scripts/package_app.sh release

      - name: Run e2e dictation
        # The packaged app hears a WAV, dictates into a throwaway window, and
        # the inserted text is scored (scripts/e2e-dictation.sh). Exit 3 means
        # the Mac was not in a state to run it (locked, no STT server, no
        # Accessibility grant, a lagging speech service): a guarded dispatch
        # on main reports that and stays green, like the guard's own skips,
        # while a branch dispatch or a label is a PR asking for a result and
        # goes red.
        id: e2e
        if: steps.guard.outputs.run != 'false'
        # A job timeout SIGKILLs the step, and then nothing relaunches the
        # owner's app. Two scenarios take about
        # two minutes; this bound ends a wedged run while the job can still
        # deliver the script's TERM.
        timeout-minutes: 10
        env:
          LOCALVOXTRAL_DISABLE_LOGIN_KEYCHAIN: "1"
        run: |
          # From a fixed copy outside the workspace with .build hidden (#87).
          # Fixed, so the owner can add it in System Settings > Privacy &
          # Security > Accessibility once (docs/agent/test-tiers.md, "Proving
          # a change with the e2e dictation check").
          HARNESS_DIR="$HOME/Library/Application Support/localvoxtral-e2e"
          mkdir -p "$HARNESS_DIR"
          rm -rf "$HARNESS_DIR/localvoxtral.app"
          ditto dist/localvoxtral.app "$HARNESS_DIR/localvoxtral.app"
          mv .build .build.smoke-hidden
          trap 'mv .build.smoke-hidden .build' EXIT
          mkdir -p logs
          set +e
          ./scripts/e2e-dictation.sh "$HARNESS_DIR/localvoxtral.app" 2>&1 | tee logs/e2e-dictation.log
          STATUS="${PIPESTATUS[0]}"
          set -e
          if [[ "$STATUS" == "0" ]]; then
            echo "scored=true" >> "$GITHUB_OUTPUT"
          fi
          sed -n '/^E2E dictation summary:/,$p' logs/e2e-dictation.log >> "$GITHUB_STEP_SUMMARY"
          if [[ "$STATUS" == "3" && "$GUARDED" == "true" ]]; then
            echo "::warning::e2e dictation did not run: the Mac was not in a state to run it."
            exit 0
          fi
          exit "$STATUS"

      - name: E2E dictation scored
        # What the release gates read (scripts/release.sh and
        # scripts/ci/daily-release-plan.sh): the step above concludes
        # `success` on a guarded exit 3 too, so its conclusion cannot say
        # that every scenario was scored. The name must match E2E_STEP in
        # both scripts.
        if: ${{ !cancelled() && steps.e2e.outputs.scored == 'true' }}
        run: echo "Every e2e dictation scenario was scored and passed."

      - name: Upload e2e dictation log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-dictation-log
          path: logs/e2e-dictation.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Package the harness build for the UI gate
        # The UI gate launches only com.localvoxtral.app and drives it with
        # the owner's settings, so it gets the harness under the release's
        # id. Same build, so this repackage compiles nothing.
        id: gate_package
        if: >-
          ${{ !cancelled()
          && runner.environment == 'self-hosted'
          && github.event_name == 'workflow_dispatch'
          && steps.package.outcome == 'success' }}
        env:
          LOCALVOXTRAL_CODESIGN_IDENTITY: localvoxtral-dev
          LOCALVOXTRAL_E2E_HARNESS: "1"
        run: ./scripts/package_app.sh release

      - name: Install the harness build into the UI gate's artifact root
        # An agent driving the SSH UI gate can build but cannot install: no
        # gate verb runs try-pr.sh and that account has no shell. This runner
        # is a launchd agent in the owner's GUI session, so $HOME here is the
        # gate's home, and a dispatch of this workflow is the install: the
        # gate's `app` verbs need the control socket, which only this package
        # has (`launch --harness`). Dispatch only, and after the e2e check:
        # no PR label or schedule writes into the owner's home, and the check
        # has already quit its app. `runner.environment` is redundant on this
        # self-hosted job and stays, because this step writes into the
        # owner's home; scripts/ci/test-ui-gate.sh asserts it by name.
        if: >-
          ${{ !cancelled()
          && runner.environment == 'self-hosted'
          && github.event_name == 'workflow_dispatch'
          && steps.gate_package.outcome == 'success' }}
        run: |
          set -uo pipefail
          STATUS=0
          INSTALLED="$(./scripts/mac/install-ui-artifact.sh dist/localvoxtral.app --no-hint \
            --label "${GITHUB_REF_NAME} @ ${GITHUB_SHA:0:7} (UI Smoke run ${GITHUB_RUN_ID})")" || STATUS=$?
          if (( STATUS == 3 )); then
            # The one refusal that is not a build problem: that slot is
            # running, which only the operator can resolve.
            echo "::warning::UI-gate install skipped — the target bundle is running. Quit it (ssh lv-ui 'quit') and re-dispatch."
            echo "UI-gate install skipped: the target bundle is running." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if (( STATUS != 0 )); then
            echo "::error::UI-gate install failed (exit $STATUS)."
            exit "$STATUS"
          fi
          GATE_ARG="${INSTALLED#"$HOME"/}"
          {
            echo "### Installed for the UI gate"
            echo
            echo '```'
            echo "ssh lv-ui 'launch --harness $GATE_ARG'"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
