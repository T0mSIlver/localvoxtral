name: UI Smoke

on:
  workflow_dispatch:
    inputs:
      drill_only:
        # A change to the drill alone needs no dictation, and the dictation
        # job takes the owner's Mac.
        description: Run only the hosted AX drill, not the Mac's e2e dictation
        type: boolean
        default: false
  schedule:
    # Evening retry ladder anchored at 20:00 Paris (owner request,
    # 2026-07-20): the e2e dictation needs an UNLOCKED GUI session on the
    # owner's Mac, and the old 04:00 slot always found the MacBook locked
    # (every window interaction false-reds — run 29722553773). Each slot runs
    # the guard in the e2e-dictation job and skips green when the Mac is on
    # battery power (personal machine — owner request, 2026-07-24), the
    # screen is locked, or an earlier slot's dictation was already scored
    # (see scripts/ci/ui-smoke-guard.sh), so at most one real dictation runs
    # per day, at whichever slot finds the Mac unlocked. The hosted AX drill
    # has no lock to wait for and runs at the first slot only. GitHub cron is UTC: 18:00 UTC = 20:00 Paris
    # in summer (CEST), 19:00 in winter (CET) — the lane needs "evening,
    # Mac likely unlocked", not a precise hour, so DST drift is fine.
    - cron: "0 18 * * *"
    - cron: "30 19 * * *"
    - cron: "0 21 * * *"
  # UI-affecting PRs get automated proof on demand: add the needs-ui-smoke
  # label (re-add it to rerun after new pushes). Both jobs run.
  pull_request:
    types: [labeled]

concurrency:
  group: ui-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # ui-smoke-guard.sh reads past runs of this workflow.
  actions: read

jobs:
  # The AX drill (scripts/ui-smoke.sh) on a GitHub-hosted runner (#573): it
  # forces External URL mode, starts no dictation and has polishing off, so it
  # needs no API key, microphone, Metal or backend, and reaches no server. The
  # hosted image pre-grants Accessibility and Screen Recording to bash and
  # osascript, which is what the drill's TCC preflight and System Events calls
  # run as. It needs no unlocked Mac and no fork check: a hosted runner never
  # sees the owner's machine.
  ax-drill:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 18 * * *') ||
      (github.event_name == 'pull_request' && github.event.label.name == 'needs-ui-smoke')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags so package_app.sh can git-describe the version.
          fetch-depth: 0

      - name: Record runner
        # About 30 % of hosted macOS runners have no audio device. The drill
        # must not depend on one; this line says which kind a red run had.
        run: |
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"
          if system_profiler SPAudioDataType 2>/dev/null | grep -q 'Input Channels'; then
            echo "Audio input device: present" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Audio input device: none" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Package app bundle
        # Ad-hoc signed and without the MLX helpers, like build-test's fork-PR
        # bundle: the signing identity lives in the owner's keychain and the
        # image has no MetalToolchain. The drill runs in External URL mode, so
        # it launches neither helper.
        env:
          LOCALVOXTRAL_SKIP_POLISHD: "1"
          LOCALVOXTRAL_SKIP_SPEECHD: "1"
          LOCALVOXTRAL_REQUIRE_CODESIGN_IDENTITY: "0"
        run: ./scripts/package_app.sh release

      - name: Run AX UI smoke
        env:
          # The ad-hoc bundle has no Team ID, so its first login-keychain read
          # would raise the ACL prompt. The drill needs no API key.
          LOCALVOXTRAL_DISABLE_LOGIN_KEYCHAIN: "1"
        run: |
          # Launch a copy from outside the workspace with .build hidden, as
          # build-test's launch smoke does: a same-tree launch passes even when
          # the binary's resource lookup depends on the builder's .build path,
          # which crashes on every other machine (#87).
          SMOKE_DIR="$(mktemp -d "$RUNNER_TEMP/ui-smoke.XXXXXX")"
          ditto dist/localvoxtral.app "$SMOKE_DIR/localvoxtral.app"
          mv .build .build.smoke-hidden
          trap 'mv .build.smoke-hidden .build' EXIT
          mkdir -p logs
          set -o pipefail
          ./scripts/ui-smoke.sh "$SMOKE_DIR/localvoxtral.app" 2>&1 | tee logs/ui-smoke.log

      - name: Capture the screen
        if: failure()
        run: |
          mkdir -p logs
          screencapture -x logs/ui-smoke-screen.png || true

      - name: Upload UI smoke log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-smoke-log
          path: |
            logs/ui-smoke.log
            logs/ui-smoke-screen.png
          if-no-files-found: ignore
          retention-days: 14

  # The e2e dictation check stays on the owner's Mac: it needs the STT server,
  # the Accessibility grant of the signed bundle and an unlocked GUI session.
  e2e-dictation:
    # Same security invariant as ci.yml: fork PRs must never reach the
    # self-hosted runner, label or no label.
    if: >-
      (github.event_name == 'schedule') ||
      (github.event_name == 'workflow_dispatch' && !inputs.drill_only) ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'needs-ui-smoke' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep gitignored build state between runs on the persistent
          # self-hosted runner (same rationale as ci.yml/eval-e2e.yml). The
          # workspace is shared with ci.yml, so the default `git clean -ffdx`
          # here wiped .build and both helper DerivedData trees every night —
          # the first CI run each morning then paid ~7 min of cold MLX C++ +
          # Metal helper rebuilds (observed run 29763957545, 2026-07-20).
          clean: false

      - name: Decide whether this scheduled slot runs (power + lock probes + already-covered)
        # Enforced for schedule events only: workflow_dispatch and the
        # needs-ui-smoke label are explicit operator intent and always run.
        # The decision logic lives in scripts/ci/ui-smoke-guard.sh (kept out
        # of the workflow so it is testable — test-ui-smoke-guard.sh runs in
        # ci.yml's shell-test step); it fails OPEN on probe errors so a
        # broken probe can never silently disable the lane.
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DECISION="$(./scripts/ci/ui-smoke-guard.sh)"
          echo "$DECISION" >> "$GITHUB_OUTPUT"
          REASON="$(sed -n 's/^reason=//p' <<<"$DECISION")"
          if [[ "$(sed -n 's/^run=//p' <<<"$DECISION")" == "true" ]]; then
            echo "E2E dictation slot: RUNNING ($REASON)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "E2E dictation slot: SKIPPED ($REASON)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Clean stale outputs (keep build caches)
        # Shared repair-and-clean for the persistent workspace (see the
        # script for the removal list and .build.smoke-hidden rationale).
        #
        # The guard condition compares `!= 'false'` (not `== 'true'`) so a
        # missing output fails OPEN: if the guard ever exits 0 without
        # emitting run=..., the dictation runs rather than every slot
        # silently skipping green forever. Same condition on the steps below.
        if: github.event_name != 'schedule' || steps.guard.outputs.run != 'false'
        run: ./scripts/ci/clean-stale-outputs.sh

      - name: Package dogfood app bundle (dictates from a file)
        # The e2e dictation check needs the instrumented build: only it can
        # dictate from a WAV in place of the microphone (docs/dogfood-builds.md).
        # Enablement is the step env, never the .dogfood-capture-enable marker
        # file, for the reason ci.yml gives: this workspace is persistent.
        if: github.event_name != 'schedule' || steps.guard.outputs.run != 'false'
        env:
          LOCALVOXTRAL_CODESIGN_IDENTITY: localvoxtral-dev
          LOCALVOXTRAL_DOGFOOD: "1"
        run: ./scripts/package_app.sh release

      - name: Run e2e dictation
        # The packaged app hears a WAV, dictates into a throwaway window, and
        # the inserted text is scored (scripts/e2e-dictation.sh). Exit 3 means
        # the Mac was not in a state to run it (locked, no STT server, no
        # Accessibility grant, a lagging speech service): a scheduled slot
        # reports that and stays green,
        # like the guard's own skips, while a dispatch or a label is an operator
        # asking for a result and goes red.
        id: e2e
        if: github.event_name != 'schedule' || steps.guard.outputs.run != 'false'
        # A job timeout SIGKILLs the step, and then nothing restores the
        # owner's defaults until the next lane run. Two scenarios take about
        # two minutes; this bound ends a wedged run while the job can still
        # deliver the script's TERM.
        timeout-minutes: 10
        env:
          LOCALVOXTRAL_DISABLE_LOGIN_KEYCHAIN: "1"
        run: |
          mkdir -p logs
          set +e
          ./scripts/e2e-dictation.sh 2>&1 | tee logs/e2e-dictation.log
          STATUS="${PIPESTATUS[0]}"
          set -e
          if [[ "$STATUS" == "0" ]]; then
            echo "scored=true" >> "$GITHUB_OUTPUT"
          fi
          sed -n '/^E2E dictation summary:/,$p' logs/e2e-dictation.log >> "$GITHUB_STEP_SUMMARY"
          if [[ "$STATUS" == "3" && "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            echo "::warning::e2e dictation did not run: the Mac was not in a state to run it."
            exit 0
          fi
          exit "$STATUS"

      - name: E2E dictation scored
        # What ui-smoke-guard.sh reads to decide that today's dictation is
        # covered. The step above concludes `success` on a scheduled exit 3
        # too, so its conclusion cannot say that every scenario was scored.
        # The name must match E2E_STEP in the guard.
        if: ${{ !cancelled() && steps.e2e.outputs.scored == 'true' }}
        run: echo "Every e2e dictation scenario was scored and passed."

      - name: Upload e2e dictation log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-dictation-log
          path: logs/e2e-dictation.log
          if-no-files-found: ignore
          retention-days: 14
