name: Record README Demo

# Hands-free demo recording on the Mac Mini runner (GUI session):
# scripts/record-demo.sh stages two Claude Code sessions in herdr inside
# Ghostty, drives the app through the seven beats of "one morning with two
# agents" (#1847), with speech and polish answered by a scripted backend
# (scripts/lib/demo-backend.py): the 8 GB Mini cannot run the 4B models next
# to two Claude sessions.
# The `edit` job then cuts the raw take into the README story and one clip
# per beat, captions burned in, on a hosted runner: Homebrew's ffmpeg on the
# Mini has no drawtext.
#
# Publishing stays manual by design: GitHub only renders inline README video
# from user-attachments URLs, which have no upload API, so the owner
# drag-drops story.mp4 into a PR comment and pastes the URL.
#
# The take files one real issue in T0mSIlver/localvoxtral-demo (the Inbox
# beat) and closes it when it ends. Runner requirements, beyond the
# capture-assets grants: Ghostty >= 1.4, herdr, a logged-in `claude`, `gh`
# logged in for the runner user, ffmpeg, BlackHole 2ch, notifications allowed
# while the display is shared, and the app's Automation -> Ghostty grant (see
# scripts/record-demo.sh).

on:
  workflow_dispatch:

concurrency:
  group: record-demo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  record-demo:
    runs-on: [self-hosted, mini]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check record script
        id: guard
        run: |
          if [[ ! -f scripts/record-demo.sh ]]; then
            echo "scripts/record-demo.sh is not present on this ref; skipping demo recording."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Idle guard (cheap, pre-build)
        # The recorder's own hands-free idle guard (scripts/record-demo.sh)
        # runs AFTER packaging, so a refused takeover would still burn a ~7 min
        # helper build on the runner. Duplicate the cheap check
        # here to fail in seconds instead; the script's guard remains the
        # authoritative one (it re-checks immediately before the takeover).
        if: steps.guard.outputs.present == 'true'
        run: |
          IDLE="$(ioreg -c IOHIDSystem 2>/dev/null \
            | awk '/HIDIdleTime/ {print int($NF/1000000000); exit}')"
          REQUIRED="${DEMO_IDLE_REQUIRED_SECONDS:-120}"
          if [[ -z "$IDLE" ]]; then
            echo "Cannot read HID idle time — failing before the build (the script would refuse anyway)." >&2
            exit 1
          fi
          if (( IDLE < REQUIRED )); then
            echo "Machine in active use (idle ${IDLE}s < ${REQUIRED}s) — refusing before the build. Rerun when the Mac is idle." >&2
            exit 1
          fi
          # A pre-running Ghostty swallows the launch args (the script
          # aborts after the build). A dedicated GUI runner quits it instead.
          if [[ "${LOCALVOXTRAL_DEDICATED_GUI:-0}" != 1 ]] && pgrep -xiq ghostty; then
            echo "Ghostty is already running; the scene must launch it itself. Quit Ghostty and rerun." >&2
            exit 1
          fi
          # And for a locked screen: the recorder fails fast on Secure
          # Keyboard Entry anyway, but only AFTER packaging. Same probe as
          # scripts/ci/ui-smoke-guard.sh; probe errors fail open (an
          # uncomputable state must not silently disable the lane).
          LOCK_STATE="$(swift - <<'SWIFT' 2>/dev/null || echo error
          import CoreGraphics
          guard let session = CGSessionCopyCurrentDictionary() as? [String: Any] else {
            print("no-session")
            exit(0)
          }
          print(session["CGSSessionScreenIsLocked"] != nil ? "locked" : "unlocked")
          SWIFT
          )"
          if [[ "$LOCK_STATE" == "locked" || "$LOCK_STATE" == "no-session" ]]; then
            echo "GUI session is $LOCK_STATE — the recorder needs an unlocked session. Refusing before the build." >&2
            exit 1
          fi
          echo "Idle guard (pre-build): machine idle ${IDLE}s (>= ${REQUIRED}s), session unlocked."

      - name: Package app bundle
        if: steps.guard.outputs.present == 'true'
        env:
          LOCALVOXTRAL_CODESIGN_IDENTITY: localvoxtral-dev
        run: ./scripts/package_app.sh release

      - name: Record demo (hands-free)
        id: record
        if: steps.guard.outputs.present == 'true'
        env:
          # See the note in ui-smoke.yml: a fresh build reading a keychain item
          # pops a modal prompt on the owner's Mac, and the demo needs no key.
          LOCALVOXTRAL_DISABLE_LOGIN_KEYCHAIN: "1"
          DEMO_WARMUP_SECONDS: "5"
        run: |
          bash scripts/record-demo.sh dist/localvoxtral.app
          # The runner's /bin/bash 3.2 has returned exit 0 on a PARSE ERROR
          # before — never trust the exit code alone, require the artifact.
          test -s dist/demo/demo.mp4 && test -s dist/demo/timeline.json \
            || { echo "demo.mp4 or timeline.json was not produced"; exit 1; }
          echo "ran=true" >> "$GITHUB_OUTPUT"

      - name: Upload the take
        if: steps.record.outputs.ran == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readme-demo-take
          path: |
            dist/demo/demo-raw.mov
            dist/demo/demo.mp4
            dist/demo/timeline.json
            dist/demo/backend.log
          if-no-files-found: error
          retention-days: 14
      # A beat that failed its check leaves the take, both panes and the
      # app's log behind, for debugging; it never becomes the demo.
      - name: Upload the failed take
        if: failure() && steps.guard.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readme-demo-failed-take
          path: dist/demo/failed-take*
          if-no-files-found: ignore
          retention-days: 3
    outputs:
      ran: ${{ steps.record.outputs.ran }}

  edit:
    needs: record-demo
    if: needs.record-demo.outputs.ran == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the take
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: readme-demo-take
          path: take

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null

      - name: Cut the story and the clips
        run: python3 scripts/edit-demo.py take/demo-raw.mov take/timeline.json dist/demo

      - name: Upload the story, clips and frames
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readme-demo
          path: dist/demo/
          if-no-files-found: error
          retention-days: 14
