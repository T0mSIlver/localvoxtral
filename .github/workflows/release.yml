name: Release App

# One-command releases: dispatch with a bump level (or explicit version) and
# the pipeline gates, tags, packages, and publishes. The tag is created ONLY
# after every gate passes — a failed release leaves no orphan tag behind.
# Trigger from anywhere: ./scripts/release.sh minor   (wraps gh workflow run)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump from the latest v* tag"
        required: false
        default: "patch"
        type: choice
        options: [patch, minor, major]
      version:
        description: "Explicit version (X.Y.Z, or X.Y.Z-rc.N for a prerelease) — overrides bump"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Self-hosted for speed (warm build cache, live voxmlx for the integration
    # gate). Releases stay ad-hoc signed: the runner's localvoxtral-dev cert
    # is meaningless on users' machines, so we don't set the identity here.
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      # Stable releases dispatch on main; X.Y.Z-rc.N prereleases may dispatch
      # on any branch (the Compute version step enforces this pairing), so a
      # release candidate can be installed via install.sh and hand-tested
      # end-to-end before the branch merges.
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Compute version
        id: meta
        run: |
          set -euo pipefail
          EXPLICIT="${{ inputs.version }}"
          if [[ -n "$EXPLICIT" ]]; then
            if [[ ! "$EXPLICIT" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
              echo "Invalid explicit version: $EXPLICIT (expected X.Y.Z or X.Y.Z-rc.N)"; exit 1
            fi
            VERSION="$EXPLICIT"
          else
            # --exclude keeps rc tags out of the bump base, or a stale rc
            # would poison the arithmetic below.
            LATEST="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v*-*' 2>/dev/null || echo v0.0.0)"
            BASE="${LATEST#v}"
            IFS=. read -r MA MI PA <<< "$BASE"
            case "${{ inputs.bump }}" in
              major) VERSION="$((MA+1)).0.0" ;;
              minor) VERSION="$MA.$((MI+1)).0" ;;
              patch) VERSION="$MA.$MI.$((PA+1))" ;;
              *) echo "Unknown bump"; exit 1 ;;
            esac
          fi
          if [[ "$VERSION" == *-rc.* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          if [[ "${{ github.ref_name }}" != "main" && "$PRERELEASE" != "true" ]]; then
            echo "Stable releases dispatch on main only. To cut a prerelease from '${{ github.ref_name }}', pass an explicit X.Y.Z-rc.N version."; exit 1
          fi
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
             || git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "Tag already exists: $TAG"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (prerelease=$PRERELEASE) from ${{ github.ref_name }} @ $(git rev-parse --short HEAD)"

      - name: Gate — build
        run: swift build -c release

      - name: Gate — unit tests
        run: |
          swift test \
            --skip RealtimeAPIVLLMIntegrationTests

      - name: Gate — live integration (voxmlx)
        env:
          VLLM_REALTIME_TEST_ENABLE: "1"
          VLLM_REALTIME_TEST_MODEL: T0mSIlver/Voxtral-Mini-4B-Realtime-2602-MLX-4bit
        run: swift test --filter RealtimeAPIVLLMIntegrationTests

      - name: Gate — package app bundle
        run: ./scripts/package_app.sh release "${{ steps.meta.outputs.version }}" "${{ github.run_number }}"

      - name: Gate — packaged app launch smoke test
        run: |
          python3 - <<'PY'
          import subprocess, time
          process = subprocess.Popen(["dist/localvoxtral.app/Contents/MacOS/localvoxtral"])
          time.sleep(2)
          if process.poll() is not None:
              raise SystemExit(f"packaged app exited during smoke test: {process.returncode}")
          process.terminate()
          try:
              process.wait(timeout=5)
          except subprocess.TimeoutExpired:
              process.kill(); process.wait(timeout=5)
          PY

      - name: Create release artifacts (zip + dmg)
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/localvoxtral.app" "dist/localvoxtral-$TAG.zip"
          if ! command -v uvx >/dev/null 2>&1; then
            echo "uvx is required to build the styled DMG; install uv on the release runner."
            exit 1
          fi
          uvx --from dmgbuild dmgbuild \
            -s scripts/dmg_settings.py \
            -D app=dist/localvoxtral.app \
            "localvoxtral" "dist/localvoxtral-$TAG.dmg"
          ditto -c -k --keepParent \
            "dist/localvoxtral.dSYM" "dist/localvoxtral-$TAG.dSYM.zip"
          # Helper dSYM: MLX C++/Metal crashes in the polishing helper are
          # the likeliest field crashes; releases must carry its symbols.
          ditto -c -k --keepParent \
            "dist/localvoxtral-polishd.dSYM" "dist/localvoxtral-polishd-$TAG.dSYM.zip"
          (
            cd dist
            shasum -a 256 "localvoxtral-$TAG.zip" > "localvoxtral-$TAG.zip.sha256"
            shasum -a 256 "localvoxtral-$TAG.dmg" > "localvoxtral-$TAG.dmg.sha256"
          )

      - name: Tag (all gates green)
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "localvoxtral $TAG"
          git push origin "$TAG"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: localvoxtral ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/localvoxtral-${{ steps.meta.outputs.tag }}.zip
            dist/localvoxtral-${{ steps.meta.outputs.tag }}.zip.sha256
            dist/localvoxtral-${{ steps.meta.outputs.tag }}.dmg
            dist/localvoxtral-${{ steps.meta.outputs.tag }}.dmg.sha256
            dist/localvoxtral-${{ steps.meta.outputs.tag }}.dSYM.zip
            dist/localvoxtral-polishd-${{ steps.meta.outputs.tag }}.dSYM.zip
