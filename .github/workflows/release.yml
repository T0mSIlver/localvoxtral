name: Release App

# One-command releases: dispatch with a bump level (or explicit version) and
# the pipeline gates, tags, packages, and publishes. The tag is created ONLY
# after every gate passes — a failed release leaves no orphan tag behind.
# Trigger from anywhere: ./scripts/release.sh minor   (wraps gh workflow run)
#
# THREE CHANNELS, ONE PIPELINE, sharing every gate on purpose: a second
# pipeline would drift.
#   * stable: hand-dispatched through release.sh, which refuses unless the
#     e2e dictation check passed on the release commit.
#   * daily: dispatched on main at 03:15 UTC by the dev box's scheduler
#     (release.sh daily); the 03:15 cron is only its fallback, because
#     GitHub fires it hours late (#826). A stable minor release
#     (v0.9.x -> v0.10.0) of the newest main commit on which a UI Smoke run scored the e2e
#     dictation check (scripts/ci/daily-release-plan.sh). The owner starts
#     that run on main when he is at the Mac, so the commit is main as it was
#     then, and can be behind main's head. Nothing new, or nothing checked:
#     no release that day.
#   * nightly: on demand only (release.sh nightly). A prerelease of main's
#     head without the e2e gate, never /releases/latest, pruned to 7.
#
# Rehearsal: `publish=false` runs the whole pipeline and uploads the
# artifacts, but creates no tag and no release. That is how a change to THIS
# file is proved before it merges.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "stable (hand-cut), daily (minor bump of the newest main commit the e2e dictation passed on) or nightly (main, prerelease)"
        required: false
        default: "stable"
        type: choice
        options: [stable, daily, nightly]
      bump:
        description: "Version bump from the latest v* tag (stable channel only)"
        required: false
        default: "patch"
        type: choice
        options: [patch, minor, major]
      version:
        description: "Explicit version (X.Y.Z, or X.Y.Z-rc.N for a prerelease) — overrides bump"
        required: false
        type: string
      publish:
        description: "Publish for real. false = rehearsal: all gates run, no tag, no release, artifacts uploaded"
        required: false
        default: true
        type: boolean
  schedule:
    # 03:15 UTC daily release, while the owner is away from the Mac and clear
    # of eval-e2e at 04:45 UTC on the same single runner. A schedule event is
    # always the daily channel. GitHub fires it hours late (08:24-08:46 UTC
    # the week of #826), so the dev box's scheduler dispatches the release at
    # 03:15 and this cron is the fallback: the Plan step skips it outside the
    # night window or after a release run that already covered the night.
    - cron: "15 3 * * *"

permissions:
  contents: write
  # daily-release-plan.sh reads UI Smoke runs, recent-run-guard.sh this
  # workflow's runs.
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Self-hosted for speed (warm build cache, live speechd STT service for the
    # integration gate), and because the Developer ID identity and the
    # notarytool profile live in the owner's login keychain on that Mac (#1430).
    runs-on: [self-hosted, macOS, ARM64]
    # This checkout is clean, so every run rebuilds from cold: observed
    # releases ran 7-20 min before notarization. Notarization adds two Apple
    # submissions (the app, then the DMG), usually minutes each, but Apple can
    # hold a team's first submissions for hours. notarize.sh's own bounds (3 h
    # for each) must expire before this one, so a stuck run fails with the
    # submission id instead of being cancelled: 20 min of gates, two 3 h
    # waits and a few minutes of DMG building and stapling come to about
    # 385 min. The unit gate has its own 900 s supervisor, so a hang is caught
    # long before this. Self-hosted jobs may exceed GitHub's hosted 360 min cap.
    timeout-minutes: 420
    env:
      # Not a secret: the name and team ID are in every signature it makes.
      DEVELOPER_ID_IDENTITY: "Developer ID Application: Tom Vaucourt (3N63N7U9R3)"
      NOTARY_PROFILE: localvoxtral-notary
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      # Stable releases dispatch on main; X.Y.Z-rc.N prereleases may dispatch
      # on any branch (the Compute version step enforces this pairing), so a
      # release candidate can be installed via install.sh and hand-tested
      # end-to-end before the branch merges. Daily and nightly releases
      # publish from main only. Rehearsals (publish=false) run from any ref
      # on any channel.
      #
      # The dispatched commit, not the branch name: the branch can move while
      # this job waits for the Mac, and release.sh checked the e2e dictation
      # result for github.sha (#1490).
      - name: Checkout release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Plan this run
        # Everything that decides WHETHER this run proceeds, and for a daily
        # release WHICH commit it ships, in one place, so every step below
        # carries a single `if:`. A run stops here, green, when:
        #   * it is scheduled and scheduled-run-guard.sh says skip, which
        #     chains three guards (tested by test-scheduled-run-guard.sh):
        #     - night-window-guard.sh 30: the run must end by 07:00 UTC, when
        #       the owner starts work on the Mac. 30 is the longest observed
        #       release (7-20 min) plus notarization;
        #     - recent-run-guard.sh release.yml 20: a release run on main
        #       succeeded, or is queued or running, in the last 20 h, most
        #       often the scheduler's 03:15 dispatch;
        #     - ac-power-guard.sh (owner rule 2026-07-24: scheduled lanes
        #       never drain the MacBook).
        #     Dispatches never consult them;
        #   * it is a daily release and scripts/ci/daily-release-plan.sh finds
        #     nothing to ship: main is already the newest stable tag, or no
        #     commit since that tag passed the e2e dictation check.
        # Stable and nightly dispatches always build.
        #
        # A daily release checks out the commit the plan picked, which can be
        # behind main's head, so every step below builds, tags and ships that
        # commit.
        id: plan
        env:
          CHANNEL_INPUT: ${{ inputs.channel }}
          PUBLISH_INPUT: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            CHANNEL="daily"
            PUBLISH="true"
          else
            CHANNEL="${CHANNEL_INPUT:-stable}"
            PUBLISH="${PUBLISH_INPUT:-true}"
          fi
          case "$CHANNEL" in
            stable|daily|nightly) ;;
            *) echo "Unknown channel: $CHANNEL"; exit 1 ;;
          esac
          case "$PUBLISH" in
            true|false) ;;
            *) echo "Unknown publish value: $PUBLISH"; exit 1 ;;
          esac

          if [[ "$PUBLISH" == "true" && "$CHANNEL" != "stable" \
                && "$GITHUB_REF_NAME" != "main" ]]; then
            echo "The $CHANNEL channel publishes from main only. To exercise this pipeline from '$GITHUB_REF_NAME', dispatch with publish=false (rehearsal)."
            exit 1
          fi

          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

          PROCEED=true
          DECISION="$(./scripts/ci/scheduled-run-guard.sh release.yml 30 20)"
          REASON="$(sed -n 's/^reason=//p' <<<"$DECISION")"
          if [[ "$(sed -n 's/^run=//p' <<<"$DECISION")" != "true" ]]; then
            PROCEED=false
          fi

          if [[ "$PROCEED" == "true" && "$CHANNEL" == "daily" ]]; then
            # Fails closed: an API error exits non-zero and the run goes red.
            DECISION="$(./scripts/ci/daily-release-plan.sh)"
            REASON="$(sed -n 's/^reason=//p' <<<"$DECISION")"
            if [[ "$(sed -n 's/^run=//p' <<<"$DECISION")" == "true" ]]; then
              RELEASE_SHA="$(sed -n 's/^sha=//p' <<<"$DECISION")"
              if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                echo "daily-release-plan.sh said run=true without a commit: $DECISION"; exit 1
              fi
              git checkout --quiet --detach "$RELEASE_SHA"
            else
              PROCEED=false
            fi
          fi
          echo "proceed=$PROCEED" >> "$GITHUB_OUTPUT"

          {
            if [[ "$PROCEED" != "true" ]]; then
              echo "## Release skipped ($CHANNEL channel)"
              echo ""
              echo "$REASON"
            elif [[ "$PUBLISH" != "true" ]]; then
              echo "## REHEARSAL — no tag, no release"
              echo ""
              echo "Channel \`$CHANNEL\` from \`$GITHUB_REF_NAME\` @ \`$(git rev-parse --short HEAD)\` — $REASON."
              echo "Every gate and the packaging run; the artifacts are uploaded as"
              echo "\`localvoxtral-release-rehearsal\` and nothing is tagged or published."
            else
              echo "## Release ($CHANNEL channel)"
              echo ""
              echo "From \`$GITHUB_REF_NAME\` @ \`$(git rev-parse --short HEAD)\` — $REASON."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Compute version
        # The `!= 'false'` comparison (not `== 'true'`) fails OPEN, the same
        # way eval-e2e.yml and ui-smoke.yml gate on their guards: a plan step
        # that somehow produced no output must not silently skip every
        # release forever. Same condition on every step below.
        if: steps.plan.outputs.proceed != 'false'
        id: meta
        env:
          # env indirection rather than inline ${{ }}: `version` is a
          # free-text dispatch input and lands in a shell script.
          EXPLICIT: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
          CHANNEL: ${{ steps.plan.outputs.channel }}
          PUBLISH: ${{ steps.plan.outputs.publish }}
        run: |
          set -euo pipefail
          if [[ "$CHANNEL" != "stable" && -n "$EXPLICIT" ]]; then
            echo "channel=$CHANNEL computes its own version; drop the version input (or dispatch channel=stable)."; exit 1
          fi
          # The daily release is always a minor bump, whatever `bump` says.
          if [[ "$CHANNEL" == "daily" ]]; then
            BUMP=minor
          fi
          if [[ "$CHANNEL" == "nightly" ]]; then
            # Every tag that exists anywhere, so the same-day .N search cannot
            # pick a name the remote already holds.
            TAGS_FILE="$RUNNER_TEMP/existing-tags.txt"
            {
              git tag --list
              git ls-remote --tags origin | sed -n 's#.*refs/tags/##p' | sed 's/\^{}$//'
            } | sort -u > "$TAGS_FILE"
            DECISION="$(./scripts/ci/nightly-version.sh "$(date -u +%Y%m%d)" "$TAGS_FILE")"
            VERSION="$(sed -n 's/^version=//p' <<<"$DECISION")"
            PRERELEASE=true
            echo "Nightly derived from $(sed -n 's/^base=//p' <<<"$DECISION")"
          elif [[ -n "$EXPLICIT" ]]; then
            if [[ ! "$EXPLICIT" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
              echo "Invalid explicit version: $EXPLICIT (expected X.Y.Z or X.Y.Z-rc.N)"; exit 1
            fi
            VERSION="$EXPLICIT"
            if [[ "$VERSION" == *-rc.* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          else
            # --exclude keeps rc tags out of the bump base, or a stale rc
            # would poison the arithmetic below. It excludes every `v*-*` tag,
            # which is also what keeps nightlies out of the stable bump:
            # v0.8.5-nightly.20260916 must never become the base for v0.8.6.
            # scripts/ci/nightly-version.sh asserts the same property from the
            # nightly side (test-nightly-version.sh).
            LATEST="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v*-*' 2>/dev/null || echo v0.0.0)"
            BASE="${LATEST#v}"
            IFS=. read -r MA MI PA <<< "$BASE"
            case "$BUMP" in
              major) VERSION="$((MA+1)).0.0" ;;
              minor) VERSION="$MA.$((MI+1)).0" ;;
              patch) VERSION="$MA.$MI.$((PA+1))" ;;
              *) echo "Unknown bump"; exit 1 ;;
            esac
            PRERELEASE=false
          fi

          if [[ "$PUBLISH" == "true" && "$GITHUB_REF_NAME" != "main" && "$PRERELEASE" != "true" ]]; then
            echo "Stable releases dispatch on main only. To cut a prerelease from '$GITHUB_REF_NAME', pass an explicit X.Y.Z-rc.N version."; exit 1
          fi
          TAG="v$VERSION"
          # A rehearsal creates no tag, so an existing one is not a conflict —
          # rehearsing the next stable version twice must stay possible.
          if [[ "$PUBLISH" == "true" ]] \
             && { git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
                  || git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; }; then
            echo "Tag already exists: $TAG"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (channel=$CHANNEL, prerelease=$PRERELEASE, publish=$PUBLISH) from $GITHUB_REF_NAME @ $(git rev-parse --short HEAD)"

      - name: Gate — build
        if: steps.plan.outputs.proceed != 'false'
        run: swift build --build-system native -c release

      - name: Gate — unit tests
        if: steps.plan.outputs.proceed != 'false'
        # Mirrors ci.yml's tier-0 unit step, skip for skip. Two of those skips
        # are not optional here: HerdrIntegrationTests starts a LIVE herdr
        # server (it carries no XCTSkip by design — AGENTS.md), and
        # AgentDictationE2EEvalTests is the many-minute nightly eval lane. A
        # release gate must never start either by accident.
        #
        # Supervised the same way ci.yml supervises it: on a HANG the
        # supervisor samples the wedged xctest before killing it, which is the
        # only forensics a release-time hang would otherwise leave. 900 s is
        # ci.yml's bound on a slower hosted VM, so it is generous here.
        # NSUnbufferedIO keeps xctest's piped stdout from block-buffering the
        # log away from the test that hung.
        #
        # No --enable-code-coverage: nothing here consumes a profile, and this
        # workspace is checked out clean, so there is no warm .build whose
        # flags a mismatch would churn (see .github/workflows/README.md).
        run: |
          NSUnbufferedIO=YES ./scripts/ci/run-supervised-command.sh \
            900 "$RUNNER_TEMP/localvoxtral-release-unit-tests.log" -- \
            swift test --build-system native \
            --skip RealtimeAPIVLLMIntegrationTests \
            --skip SpeechHelperIntegrationTests \
            --skip AgentDictationE2EEvalTests \
            --skip HerdrIntegrationTests

      - name: Upload complete unit-test log
        if: always() && steps.plan.outputs.proceed != 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-unit-test-log
          path: ${{ runner.temp }}/localvoxtral-release-unit-tests.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Warm on-demand speechd server
        # The STT test service is launch-on-demand (scripts/mac/lv-test-servers.sh);
        # its weights are not resident 24/7, so warm it before the live
        # integration gate below (this release lane runs on the self-hosted Mac).
        # `ensure speechd` works against either the retired voxmlx plist or the
        # swapped-in speechd plist. Best-effort during rollout (a warm timeout
        # must not mask the gate) — the integration gate itself fails loudly if
        # the STT service is really down.
        if: steps.plan.outputs.proceed != 'false'
        continue-on-error: true
        run: |
          if [ -d /Users/Shared/localvoxtral/run ]; then
            ./scripts/mac/lv-test-servers.sh ensure speechd
          else
            echo "on-demand infra not installed (run dir absent) — relying on the" \
                 "resident STT service; see scripts/mac/README.md to enable on-demand."
          fi

      - name: Gate — live integration (STT service)
        id: stt_gate
        if: steps.plan.outputs.proceed != 'false'
        env:
          VLLM_REALTIME_TEST_ENABLE: "1"
          VLLM_REALTIME_TEST_MODEL: T0mSIlver/Voxtral-Mini-4B-Realtime-2602-4bit-qhead
        run: swift test --build-system native --filter RealtimeAPIVLLMIntegrationTests

      - name: Name the STT service's state
        # A red gate reads the same whether the model misheard, the reaper
        # stopped the server, or another process held port 8000 (#829).
        if: failure() && steps.stt_gate.outcome == 'failure'
        run: |
          {
            echo '```'
            ./scripts/mac/lv-test-servers.sh diagnose speechd
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check the signing credentials
        # Stable and daily releases (and their rehearsals) must ship signed with
        # Developer ID and notarized, so a missing identity or notarytool
        # profile fails them here, before packaging. A nightly falls back to
        # ad-hoc signing with a warning, and its release notes say so;
        # install.sh still re-signs an ad-hoc download for the macOS 26 launch
        # stall. Both checks name what is missing: the identity in the login
        # keychain (security find-identity), the profile through a notarytool
        # call that authenticates with it.
        if: steps.plan.outputs.proceed != 'false'
        id: signing
        env:
          CHANNEL: ${{ steps.plan.outputs.channel }}
        run: |
          set -euo pipefail
          missing=""
          if ! security find-identity -v -p codesigning | grep -qF "\"$DEVELOPER_ID_IDENTITY\""; then
            missing="the identity '$DEVELOPER_ID_IDENTITY' is not in $(id -un)'s keychain"
          # --keychain as in notarize.sh: without it the profile comes from the
          # data-protection keychain, which a locked screen makes unreadable.
          elif ! NOTARY_OUT="$(xcrun notarytool history --keychain-profile "$NOTARY_PROFILE" \
              --keychain "$HOME/Library/Keychains/login.keychain-db" 2>&1)"; then
            missing="the notarytool profile '$NOTARY_PROFILE' in the login keychain file does not authenticate: $(tail -n 3 <<<"$NOTARY_OUT" | tr '\n' ' ')"
          fi
          if [[ -z "$missing" ]]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
            echo "Signing: $DEVELOPER_ID_IDENTITY, notarized with profile $NOTARY_PROFILE" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [[ "$CHANNEL" == "nightly" ]]; then
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Nightly falls back to ad-hoc signing: $missing"
            echo "Signing: **ad-hoc, not notarized** ($missing)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::A $CHANNEL release must be signed with Developer ID and notarized, but $missing."
            exit 1
          fi

      - name: Gate — package app bundle
        if: steps.plan.outputs.proceed != 'false'
        env:
          # Empty for an ad-hoc nightly, so package_app.sh signs ad-hoc.
          LOCALVOXTRAL_CODESIGN_IDENTITY: ${{ steps.signing.outputs.notarize == 'true' && env.DEVELOPER_ID_IDENTITY || '' }}
          LOCALVOXTRAL_REQUIRE_CODESIGN_IDENTITY: ${{ steps.signing.outputs.notarize == 'true' && '1' || '0' }}
        run: ./scripts/package_app.sh release "${{ steps.meta.outputs.version }}" "${{ github.run_number }}"

      - name: Gate — packaged app launch smoke test
        if: steps.plan.outputs.proceed != 'false'
        env:
          # Same rationale as ci.yml's launch smoke: keep the real app's
          # startup TCC prompts off the runner's GUI session (node's
          # Accessibility grant dies on every runner auto-update).
          LOCALVOXTRAL_SUPPRESS_STARTUP_PERMISSION_PROMPTS: "1"
        run: |
          # A home of its own, as in ci.yml: never the owner's history (#985).
          SMOKE_HOME="$(mktemp -d)"
          SMOKE_APP=dist/localvoxtral.app SMOKE_HOME="$SMOKE_HOME" python3 scripts/ci/launch-smoke.py

      - name: Notarize and staple the app
        # The ticket is stapled into the bundle, so the zip and the DMG built
        # below carry it and Gatekeeper accepts the app offline.
        if: steps.plan.outputs.proceed != 'false' && steps.signing.outputs.notarize == 'true'
        run: |
          set -euo pipefail
          ditto -c -k --keepParent dist/localvoxtral.app "$RUNNER_TEMP/notarize-app.zip"
          NOTARIZE_TIMEOUT=3h ./scripts/ci/notarize.sh "$RUNNER_TEMP/notarize-app.zip" "$NOTARY_PROFILE"
          xcrun stapler staple dist/localvoxtral.app
          xcrun stapler validate dist/localvoxtral.app
          SPCTL="$(spctl -a -vv --type execute dist/localvoxtral.app 2>&1)"
          echo "$SPCTL"
          grep -q 'source=Notarized Developer ID' <<<"$SPCTL" \
            || { echo "::error::spctl does not accept the stapled app as Notarized Developer ID"; exit 1; }

      - name: Create release artifacts (zip + dmg)
        if: steps.plan.outputs.proceed != 'false'
        env:
          NOTARIZE: ${{ steps.signing.outputs.notarize }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/localvoxtral.app" "dist/localvoxtral-$TAG.zip"
          if ! command -v uvx >/dev/null 2>&1; then
            echo "uvx is required to build the styled DMG; install uv on the release runner."
            exit 1
          fi
          uvx --from dmgbuild dmgbuild \
            -s scripts/dmg_settings.py \
            -D app=dist/localvoxtral.app \
            "localvoxtral" "dist/localvoxtral-$TAG.dmg"
          if [[ "$NOTARIZE" == "true" ]]; then
            # Gatekeeper checks a downloaded disk image before it mounts, so
            # the DMG is signed, notarized and stapled too.
            codesign --sign "$DEVELOPER_ID_IDENTITY" --timestamp "dist/localvoxtral-$TAG.dmg"
            # 3 h, as for the app: Apple accepting the app does not speed up
            # the DMG. v0.11.1's DMG was still In Progress after 1 h
            # (run 37121470049).
            NOTARIZE_TIMEOUT=3h ./scripts/ci/notarize.sh "dist/localvoxtral-$TAG.dmg" "$NOTARY_PROFILE"
            xcrun stapler staple "dist/localvoxtral-$TAG.dmg"
            xcrun stapler validate "dist/localvoxtral-$TAG.dmg"
            spctl -a -vv --type open --context context:primary-signature "dist/localvoxtral-$TAG.dmg"
          fi
          ditto -c -k --keepParent \
            "dist/localvoxtral.dSYM" "dist/localvoxtral-$TAG.dSYM.zip"
          # Helper dSYMs: MLX C++/Metal crashes are the likeliest helper field
          # crashes; releases must carry both helpers' symbols.
          ditto -c -k --keepParent \
            "dist/localvoxtral-polishd.dSYM" "dist/localvoxtral-polishd-$TAG.dSYM.zip"
          ditto -c -k --keepParent \
            "dist/localvoxtral-speechd.dSYM" "dist/localvoxtral-speechd-$TAG.dSYM.zip"
          (
            cd dist
            shasum -a 256 "localvoxtral-$TAG.zip" > "localvoxtral-$TAG.zip.sha256"
            shasum -a 256 "localvoxtral-$TAG.dmg" > "localvoxtral-$TAG.dmg.sha256"
          )

      - name: Upload rehearsal artifacts (no tag, no release)
        # The rehearsal's whole output. Named so it can never be mistaken for
        # a release: it lives on the run, not on a tag, and expires in a week.
        if: steps.plan.outputs.proceed != 'false' && steps.plan.outputs.publish == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: localvoxtral-release-rehearsal
          path: |
            dist/localvoxtral-${{ steps.meta.outputs.tag }}.zip
            dist/localvoxtral-${{ steps.meta.outputs.tag }}.zip.sha256
            dist/localvoxtral-${{ steps.meta.outputs.tag }}.dmg
            dist/localvoxtral-${{ steps.meta.outputs.tag }}.dmg.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Summarize the rehearsal
        if: steps.plan.outputs.proceed != 'false' && steps.plan.outputs.publish == 'false'
        run: |
          {
            echo ""
            echo "REHEARSAL COMPLETE. No tag was created and no release was published."
            echo "The build that WOULD have shipped is the \`localvoxtral-release-rehearsal\` artifact on this run,"
            echo "named \`${{ steps.meta.outputs.tag }}\` (channel ${{ steps.plan.outputs.channel }})."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tag (all gates green)
        # GITHUB_TOKEN cannot push a tag whose commit changes anything under
        # .github/workflows (it lacks the workflows permission; #964), so the
        # tag goes up with RELEASE_TAG_TOKEN, a fine-grained token with
        # Contents and Workflows write on this repo. The empty extraheader
        # drops the checkout's persisted GITHUB_TOKEN so git sends this one.
        # No workflow triggers on tag pushes, so this tag starts no runs.
        if: steps.plan.outputs.proceed != 'false' && steps.plan.outputs.publish == 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_TAG_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_TAG_TOKEN" ]]; then
            echo "::error::The RELEASE_TAG_TOKEN repo secret is missing or empty; GITHUB_TOKEN cannot push this tag (#964). Nothing was tagged."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "localvoxtral $TAG"
          git -c http.https://github.com/.extraheader= push \
            "https://x-access-token:${RELEASE_TAG_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/$TAG"

      - name: Resolve release notes
        # A release can ship a human summary written ahead of time at
        # docs/release-notes/<tag>.md. Optional: with no such file the release
        # publishes with GitHub's generated notes exactly as before, so a
        # forgotten file makes a duller release, never a failed one. The one
        # hard failure is a file that exists and says nothing — see the script.
        #
        # A nightly additionally gets a fixed header saying what it is and how
        # to install it, because a prerelease of main needs that context far
        # more than a stable release does. A hand-written nightly file (rare)
        # lands under that header.
        #
        # Every release says how it is signed. A notarized one tells users
        # coming from an ad-hoc build (every release before #1430) to re-grant
        # Accessibility once: the new signature changes the designated
        # requirement macOS keys that grant on.
        if: steps.plan.outputs.proceed != 'false' && steps.plan.outputs.publish == 'true'
        id: notes
        env:
          CHANNEL: ${{ steps.plan.outputs.channel }}
          TAG: ${{ steps.meta.outputs.tag }}
          NOTARIZE: ${{ steps.signing.outputs.notarize }}
        run: |
          set -euo pipefail
          DECISION="$(./scripts/ci/resolve-release-notes.sh "$TAG")"
          RESOLVED="$(sed -n 's/^path=//p' <<<"$DECISION")"
          REASON="$(sed -n 's/^reason=//p' <<<"$DECISION")"

          BODY_PATH="$RUNNER_TEMP/release-body.md"
          {
            if [[ "$NOTARIZE" == "true" ]]; then
              echo "Signed with Developer ID and notarized by Apple."
              echo ""
              echo "> [!NOTE]"
              echo "> Upgrading from a release built before October 2026? Those were ad-hoc signed, so macOS asks for the Accessibility permission again, once. If the dictation shortcut does nothing after the upgrade, remove localvoxtral from **System Settings → Privacy & Security → Accessibility** and add it back."
            else
              echo "> [!WARNING]"
              echo "> This build is ad-hoc signed and **not notarized**. Install it with the installer script below, which re-signs it on your Mac; a DMG opened by hand may be blocked by Gatekeeper."
            fi
            echo ""
          } > "$BODY_PATH"
          if [[ "$CHANNEL" == "nightly" ]]; then
            {
              echo "Nightly build of \`main\` at \`$(git rev-parse --short HEAD)\`, built and gated by the same pipeline as a stable release."
              echo ""
              echo "This is **not a stable release**. It ships whatever was on \`main\` when it was built."
              echo ""
              echo "Install it:"
              echo ""
              echo '```bash'
              echo "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | LOCALVOXTRAL_CHANNEL=nightly bash"
              echo '```'
              echo ""
              echo "Re-run that line to update. To go back to stable, run the installer without \`LOCALVOXTRAL_CHANNEL\`."
              echo ""
            } >> "$BODY_PATH"
          fi
          if [[ -n "$RESOLVED" ]]; then
            { cat "$RESOLVED"; echo ""; } >> "$BODY_PATH"
          fi

          echo "path=$BODY_PATH" >> "$GITHUB_OUTPUT"
          echo "Release notes: $REASON" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub release
        if: steps.plan.outputs.proceed != 'false' && steps.plan.outputs.publish == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: localvoxtral ${{ steps.meta.outputs.tag }}
          # Nightlies are prereleases so GitHub's /releases/latest — the
          # pointer install.sh's stable path follows, and the link in the
          # README — keeps pointing at the newest STABLE release.
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          # Declared, not inherited: GitHub never marks a prerelease as latest
          # today, but the stable installer depends on it, so say so.
          make_latest: ${{ steps.meta.outputs.prerelease == 'true' && 'false' || 'true' }}
          # body_path + generate_release_notes, per action-gh-release v2's
          # README: "If body is specified, the body will be pre-pended to the
          # automatically generated notes", and "When providing a body and
          # body_path at the same time, body_path will be attempted first,
          # then falling back on body if the path can not be read from". So
          # the hand-written notes lead and GitHub's PR list follows.
          #
          # NOT `append_body`: that input means "append to an EXISTING
          # release's body" (an already-published release being updated), not
          # "append the generated notes to mine". Setting it here would be a
          # different feature that happens to sound right.
          #
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          files: |
            dist/localvoxtral-${{ steps.meta.outputs.tag }}.zip
            dist/localvoxtral-${{ steps.meta.outputs.tag }}.zip.sha256
            dist/localvoxtral-${{ steps.meta.outputs.tag }}.dmg
            dist/localvoxtral-${{ steps.meta.outputs.tag }}.dmg.sha256
            dist/localvoxtral-${{ steps.meta.outputs.tag }}.dSYM.zip
            dist/localvoxtral-polishd-${{ steps.meta.outputs.tag }}.dSYM.zip
            dist/localvoxtral-speechd-${{ steps.meta.outputs.tag }}.dSYM.zip

      - name: Prune old nightly releases
        # Without this, on-demand nightlies would pile up on the releases page.
        # Keep the newest 7 and delete the rest, releases and tags both.
        #
        # The selection lives in scripts/ci/prune-nightly-releases.sh, which
        # takes tags on stdin, prints only tags matching the nightly shape
        # exactly, and touches no network — so it is tested
        # (test-prune-nightly-releases.sh, in ci.yml's shell-test step)
        # against the cases that matter here: a stable or rc tag must be
        # invisible to it. The shape is re-checked in the loop below, because
        # the next command is a delete.
        if: steps.plan.outputs.proceed != 'false' && steps.plan.outputs.publish == 'true' && steps.plan.outputs.channel == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 1000, not 100: the prune only sees what this list returns, so a
          # window smaller than the release history would let nightlies
          # older than the window outlive the keep-7 rule forever.
          gh release list --limit 1000 --json tagName --jq '.[].tagName' \
            > "$RUNNER_TEMP/release-tags.txt"
          ./scripts/ci/prune-nightly-releases.sh --keep 7 "$RUNNER_TEMP/release-tags.txt" \
            > "$RUNNER_TEMP/nightlies-to-delete.txt"
          if [[ ! -s "$RUNNER_TEMP/nightlies-to-delete.txt" ]]; then
            echo "Nightly pruning: nothing to delete (7 or fewer nightly releases)" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          while IFS= read -r TAG; do
            [[ -n "$TAG" ]] || continue
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}(\.[0-9]+)?$ ]]; then
              echo "refusing to delete a tag that is not a nightly: $TAG"; exit 1
            fi
            echo "Deleting old nightly release and tag: $TAG"
            gh release delete "$TAG" --cleanup-tag --yes
          done < "$RUNNER_TEMP/nightlies-to-delete.txt"
          {
            echo "Nightly pruning: deleted $(wc -l < "$RUNNER_TEMP/nightlies-to-delete.txt" | tr -d ' ') old nightly release(s), newest 7 kept"
          } >> "$GITHUB_STEP_SUMMARY"

  # Stable and daily releases only: nightlies and rc builds are prereleases, and the tap
  # is what `brew upgrade` follows. This job runs after the release is public,
  # so a failure here leaves a good release and a stale tap; cask.yml's header
  # has the one-line repair.
  cask:
    needs: release
    if: needs.release.outputs.publish == 'true' && needs.release.outputs.prerelease == 'false'
    permissions:
      contents: read
    uses: ./.github/workflows/cask.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
