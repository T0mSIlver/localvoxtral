name: Agent Dictation E2E Eval

# The wide agent-dictation eval: dispatched only, never scheduled (owner
# decision 2026-10-08: a run on an unchanged prompt measures nothing) and never
# per-PR — it runs live TTS -> speechd ASR -> polishd inference
# over the ~160-case EvalCorpus/agent-dictation corpus and takes many minutes.
# The operator-only human-WAV baseline uses remote-build.sh's optional
# recording-set argument; CI intentionally keeps the repeatable TTS source.
# Required cases (the 7 migrated punctuation cases) assert individually;
# everything else is XFAIL-tracked on the scoreboard. Local equivalent:
# ./scripts/remote-build.sh eval-e2e (after `package`).
on:
  workflow_dispatch:

concurrency:
  group: eval-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  eval-e2e:
    # Self-hosted only, and there is no pull_request trigger above — fork code
    # must never reach this runner (same invariant as ci.yml/ui-smoke.yml).
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep gitignored build state between runs on the persistent
          # self-hosted runner (same rationale as ci.yml: default git clean
          # would force a cold MLX C++ + Metal helper rebuild every run).
          clean: false

      - name: Clean stale outputs (keep build caches)
        # Shared repair-and-clean for the persistent workspace (see the
        # script for the removal list and .build.smoke-hidden rationale).
        run: ./scripts/ci/clean-stale-outputs.sh

      - name: Ensure Metal toolchain
        # Same probe as ci.yml: `xcrun --find metal` succeeding does NOT mean
        # the component is installed; only invoking metal proves it.
        run: |
          if ! xcrun metal --version >/dev/null 2>&1; then
            echo "Metal toolchain not active for $(whoami); installing component..."
            for attempt in 1 2 3; do
              xcodebuild -downloadComponent MetalToolchain && break
              echo "catalog fetch failed (attempt $attempt); retrying in 10s..."
              sleep 10
            done
            xcrun metal --version
          fi

      - name: Package app bundle (builds the polishing helper)
        env:
          LOCALVOXTRAL_CODESIGN_IDENTITY: localvoxtral-dev
        run: ./scripts/package_app.sh release

      - name: Warm on-demand speechd server
        # Launch-on-demand infra (scripts/mac/lv-test-servers.sh): touch the
        # trigger and block until port 8000 is healthy. `ensure speechd` works
        # against either the retired voxmlx plist or the swapped-in speechd plist.
        # Best-effort during rollout (a warm timeout must not mask the eval) —
        # the eval itself fails loudly if the STT service is really down.
        continue-on-error: true
        run: |
          if [ -d /Users/Shared/localvoxtral/run ]; then
            ./scripts/mac/lv-test-servers.sh ensure speechd
          else
            echo "on-demand infra not installed (run dir absent) — relying on the" \
                 "resident STT service; see scripts/mac/README.md to enable on-demand."
          fi

      - name: Voices the runner's shell lists
        # What `say` offers outside xctest, next to the eval's voices line (#960).
        continue-on-error: true
        run: |
          echo "say -v ? lines: $(say -v '?' | wc -l)"
          echo "Samantha/Daniel/Thomas lines: $(say -v '?' | grep -c -E '^(Samantha|Daniel|Thomas)')"
          # The same report as the eval's "eval TTS env:" lines, home and
          # user masked: the difference is what hides the voices from xctest.
          home=$(perl -e 'print((getpwuid($<))[7])')
          user=$(id -un)
          mask() { sed -e "s|$home|<home>|g" -e "s|$user|<user>|g"; }
          echo "shell env: keys: $(compgen -e | LC_ALL=C sort | tr '\n' ' ')"
          for name in $(compgen -e | LC_ALL=C sort); do
            case "$name" in
              HOME|TMPDIR|CFFIXED_USER_HOME|DYLD_*|__XPC_*|XPC_*|__CF*)
                echo "shell env: $name=${!name}" | mask ;;
            esac
          done

      - name: Run agent-dictation E2E eval
        id: eval
        # About 2x a normal run. A hung run held the Mac for the whole job
        # timeout (#821).
        timeout-minutes: 60
        env:
          LV_AGENT_EVAL_E2E_ENABLE: "1"
          LV_AGENT_EVAL_E2E_HELPER_PATH: PolishHelper/.build/xcode/Build/Products/Release/localvoxtral-polishd
          LV_AGENT_EVAL_E2E_ASR_MODEL: T0mSIlver/Voxtral-Mini-4B-Realtime-2602-4bit-qhead
        run: |
          mkdir -p logs
          set -o pipefail
          # --enable-code-coverage matches ci.yml's build flags in the SHARED
          # .build (clean: false): without it this eval rebuilt the whole
          # app+test module uninstrumented, and the next morning's ci.yml
          # unit step rebuilt it back — the same flag-flip PR #157 fixed
          # inside ci.yml (PR #157 review finding).
          swift test --build-system native --filter AgentDictationE2EEvalTests --enable-code-coverage 2>&1 | tee logs/eval-e2e.log

      - name: Voices the runner's shell lists after the eval
        # Next to the eval's own listing (#960).
        if: always()
        continue-on-error: true
        run: |
          echo "say -v ? lines: $(say -v '?' | wc -l)"
          echo "Samantha/Daniel/Thomas lines: $(say -v '?' | grep -c -E '^(Samantha|Daniel|Thomas)')"

      - name: Name the STT service's state
        # A stalled eval reads the same whether the reaper stopped the server
        # or another process held port 8000 (#829).
        if: failure() && steps.eval.outcome == 'failure'
        run: |
          {
            echo '```'
            ./scripts/mac/lv-test-servers.sh diagnose speechd
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Scoreboard to step summary
        # Extract the section between the scoreboard markers (kept in sync
        # with AgentDictationE2EEvalSupport.scoreboardBeginMarker/EndMarker).
        # `always()` keeps the scoreboard on eval failure. Same on the two
        # steps below.
        if: always()
        run: |
          if [[ -f logs/eval-e2e.log ]]; then
            {
              echo '```'
              awk '/^== agent-dictation E2E eval scoreboard ==/{flag=1} flag{print} /^== end agent-dictation E2E eval scoreboard ==/{flag=0}' logs/eval-e2e.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no eval log produced" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload eval log (scoreboard artifact)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-e2e-scoreboard
          path: logs/eval-e2e.log
          retention-days: 30

      - name: Process leak check (informational)
        if: always()
        run: |
          survivors="$(ps -axo pid,etime,ucomm \
            | grep -iE 'localvoxtral|polishd|xctest|swiftpm-testing|XCBBuildService' \
            | grep -v grep || true)"
          if [[ -n "$survivors" ]]; then
            echo "candidate processes still alive at job end:"
            echo "$survivors"
          else
            echo "no candidate processes alive at job end"
          fi
