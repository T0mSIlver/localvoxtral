name: Agent Dictation E2E Eval

# The wide agent-dictation eval (owner decision 2026-07-11): weekly + manual
# only, NEVER per-PR — it runs live TTS -> speechd ASR -> polishd inference
# over the ~160-case EvalCorpus/agent-dictation corpus and takes many minutes.
# The operator-only human-WAV baseline uses remote-build.sh's optional
# recording-set argument; CI intentionally keeps the repeatable TTS source.
# Required cases (the 7 migrated punctuation cases) assert individually;
# everything else is XFAIL-tracked on the scoreboard. Local equivalent:
# ./scripts/remote-build.sh eval-e2e (after `package`).
on:
  workflow_dispatch:
  schedule:
    # Sundays only (owner decision 2026-09-25): at ~29 min a run it was the
    # largest scheduled load on the Mac, and prompts and model pins change
    # far less often than nightly. Overnight because this lane needs no GUI
    # session and the machine is idle then. GitHub fires it late, often after
    # the night window, so the dev box's scheduler dispatches it at 04:45
    # UTC and this cron is the fallback. The guard step below skips a
    # scheduled run outside the window or after a run that already covered it.
    - cron: "45 4 * * 0"

concurrency:
  group: eval-e2e
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # recent-run-guard.sh lists this workflow's runs

jobs:
  eval-e2e:
    # Self-hosted only, and there is no pull_request trigger above — fork code
    # must never reach this runner (same invariant as ci.yml/ui-smoke.yml).
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep gitignored build state between runs on the persistent
          # self-hosted runner (same rationale as ci.yml: default git clean
          # would force a cold MLX C++ + Metal helper rebuild every night).
          clean: false

      - name: Decide whether this scheduled run proceeds (night window, AC power)
        # Enforced for schedule events only: workflow_dispatch is explicit
        # operator intent and always runs. The runner is the owner's personal
        # MacBook, so a scheduled run needs three things:
        #  * the night window (night-window-guard.sh): GitHub fires the cron
        #    hours late (#822), and a run that starts after 06:30 UTC would
        #    still be polishing when the owner starts work at 07:00. 30 is the
        #    job's ~29 min, rounded up;
        #  * no other run on main that succeeded or is running in the last
        #    20 h (recent-run-guard.sh): the dev box's scheduler dispatches
        #    this eval at 04:45 UTC and the cron is only its fallback, so a
        #    cron after a dispatch would measure the same thing twice;
        #  * AC power (ac-power-guard.sh, owner request 2026-07-24): never
        #    drain the battery. It fails OPEN on probe errors so a broken
        #    probe can never silently disable the lane.
        # All three scripts are tested in ci.yml's shell-test step.
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          proceeds() { [[ "$(sed -n 's/^run=//p' <<<"$DECISION")" == "true" ]]; }
          DECISION="$(./scripts/ci/night-window-guard.sh 30)"
          if proceeds; then
            DECISION="$(./scripts/ci/recent-run-guard.sh eval-e2e.yml 20)"
          fi
          if proceeds; then
            DECISION="$(./scripts/ci/ac-power-guard.sh)"
          fi
          echo "$DECISION" >> "$GITHUB_OUTPUT"
          REASON="$(sed -n 's/^reason=//p' <<<"$DECISION")"
          if [[ "$(sed -n 's/^run=//p' <<<"$DECISION")" == "true" ]]; then
            echo "E2E eval (scheduled): RUNNING ($REASON)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "E2E eval (scheduled): SKIPPED ($REASON)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Clean stale outputs (keep build caches)
        # Shared repair-and-clean for the persistent workspace (see the
        # script for the removal list and .build.smoke-hidden rationale).
        #
        # The guard condition compares `!= 'false'` (not `== 'true'`) so a
        # missing output fails OPEN: if the guard ever exits 0 without
        # emitting run=..., the eval runs rather than every nightly silently
        # skipping green forever (same pattern as ui-smoke.yml). Same
        # condition on every step below.
        if: github.event_name != 'schedule' || steps.guard.outputs.run != 'false'
        run: ./scripts/ci/clean-stale-outputs.sh

      - name: Ensure Metal toolchain
        # Same probe as ci.yml: `xcrun --find metal` succeeding does NOT mean
        # the component is installed; only invoking metal proves it.
        if: github.event_name != 'schedule' || steps.guard.outputs.run != 'false'
        run: |
          if ! xcrun metal --version >/dev/null 2>&1; then
            echo "Metal toolchain not active for $(whoami); installing component..."
            for attempt in 1 2 3; do
              xcodebuild -downloadComponent MetalToolchain && break
              echo "catalog fetch failed (attempt $attempt); retrying in 10s..."
              sleep 10
            done
            xcrun metal --version
          fi

      - name: Package app bundle (builds the polishing helper)
        if: github.event_name != 'schedule' || steps.guard.outputs.run != 'false'
        env:
          LOCALVOXTRAL_CODESIGN_IDENTITY: localvoxtral-dev
        run: ./scripts/package_app.sh release

      - name: Warm on-demand speechd server
        # Launch-on-demand infra (scripts/mac/lv-test-servers.sh): touch the
        # trigger and block until port 8000 is healthy. `ensure speechd` works
        # against either the retired voxmlx plist or the swapped-in speechd plist.
        # Best-effort during rollout (a warm timeout must not mask the eval) —
        # the eval itself fails loudly if the STT service is really down.
        if: github.event_name != 'schedule' || steps.guard.outputs.run != 'false'
        continue-on-error: true
        run: |
          if [ -d /Users/Shared/localvoxtral/run ]; then
            ./scripts/mac/lv-test-servers.sh ensure speechd
          else
            echo "on-demand infra not installed (run dir absent) — relying on the" \
                 "resident STT service; see scripts/mac/README.md to enable on-demand."
          fi

      - name: Voices the runner's shell lists
        # What `say` offers outside xctest, next to the eval's voices line (#960).
        if: github.event_name != 'schedule' || steps.guard.outputs.run != 'false'
        continue-on-error: true
        run: |
          echo "say -v ? lines: $(say -v '?' | wc -l)"
          echo "Samantha/Daniel/Thomas lines: $(say -v '?' | grep -c -E '^(Samantha|Daniel|Thomas)')"
          # The same report as the eval's "eval TTS env:" lines, home and
          # user masked: the difference is what hides the voices from xctest.
          home=$(perl -e 'print((getpwuid($<))[7])')
          user=$(id -un)
          mask() { sed -e "s|$home|<home>|g" -e "s|$user|<user>|g"; }
          echo "shell env: keys: $(compgen -e | LC_ALL=C sort | tr '\n' ' ')"
          for name in $(compgen -e | LC_ALL=C sort); do
            case "$name" in
              HOME|TMPDIR|CFFIXED_USER_HOME|DYLD_*|__XPC_*|XPC_*|__CF*)
                echo "shell env: $name=${!name}" | mask ;;
            esac
          done

      - name: Probe the voices while an xctest process runs
        # The eval's `say -v ?` lists the 27 built-in voices even before any
        # model loads, while the shell lists them all before and after (#960).
        # The shell lists voices again while (a) this package's test bundle,
        # then (b) an empty package's, sleeps in a test.
        if: github.event_name != 'schedule' || steps.guard.outputs.run != 'false'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          probe() {  # <label> <package dir> <filter> [swift test flags...]
            local label="$1" dir="$2" filter="$3"
            shift 3
            local marker="$RUNNER_TEMP/voice-probe-$label.marker" log="$RUNNER_TEMP/voice-probe-$label.log"
            rm -f "$marker"
            (cd "$dir" && LV_VOICE_PROBE_MARKER="$marker" swift test "$@" --filter "$filter" >"$log" 2>&1) &
            local pid=$!
            for _ in $(seq 1 900); do
              [ -e "$marker" ] && break
              kill -0 "$pid" 2>/dev/null || break
              sleep 1
            done
            if [ -e "$marker" ]; then
              sleep 5
              echo "voice probe $label: xctest running, shell lists $(say -v '?' | wc -l) voices," \
                "$(say -v '?' | grep -c -E '^(Samantha|Daniel|Thomas)') Samantha/Daniel/Thomas"
            else
              echo "voice probe $label: the test never started"
              tail -20 "$log"
            fi
            wait "$pid"
            echo "voice probe $label: after xctest, shell lists $(say -v '?' | wc -l) voices"
          }
          probe package "$PWD" VoiceProbeTests --build-system native --enable-code-coverage

          empty="$RUNNER_TEMP/voice-probe-empty"
          rm -rf "$empty"
          mkdir -p "$empty/Tests/ProbeTests"
          printf '%s\n' '// swift-tools-version:5.9' 'import PackageDescription' \
            'let package = Package(name: "Probe", targets: [.testTarget(name: "ProbeTests")])' \
            >"$empty/Package.swift"
          sed -n '/^import Foundation/,$p' Tests/localvoxtralCoreTests/VoiceProbeTests.swift \
            >"$empty/Tests/ProbeTests/VoiceProbeTests.swift"
          probe empty "$empty" VoiceProbeTests

      - name: Run agent-dictation E2E eval
        id: eval
        if: github.event_name != 'schedule' || steps.guard.outputs.run != 'false'
        # About 2x a normal run. A hung run held the Mac for the whole job
        # timeout, past the end of the night window (#821).
        timeout-minutes: 60
        env:
          LV_AGENT_EVAL_E2E_ENABLE: "1"
          LV_AGENT_EVAL_E2E_HELPER_PATH: PolishHelper/.build/xcode/Build/Products/Release/localvoxtral-polishd
          LV_AGENT_EVAL_E2E_ASR_MODEL: T0mSIlver/Voxtral-Mini-4B-Realtime-2602-4bit-qhead
        run: |
          mkdir -p logs
          set -o pipefail
          # An older reaper stops the on-demand server 20 min after the last
          # `ensure` even while a client uses it, so an eval longer than that
          # lost its server mid-run (#821). The reaper counts clients since
          # #829, but runs a copy of the script on the Mac: keep ours fresh
          # until that copy is refreshed (scripts/mac/README.md).
          if [ -d /Users/Shared/localvoxtral/run ]; then
            while sleep 300; do
              ./scripts/mac/lv-test-servers.sh ensure speechd >/dev/null 2>&1 || true
            done &
            keepalive=$!
            trap 'kill "$keepalive" 2>/dev/null || true' EXIT
          fi
          # --enable-code-coverage matches ci.yml's build flags in the SHARED
          # .build (clean: false): without it this nightly rebuilt the whole
          # app+test module uninstrumented, and the next morning's ci.yml
          # unit step rebuilt it back — the same flag-flip PR #157 fixed
          # inside ci.yml (PR #157 review finding).
          swift test --build-system native --filter AgentDictationE2EEvalTests --enable-code-coverage 2>&1 | tee logs/eval-e2e.log

      - name: Voices the runner's shell lists after the eval
        # Next to the eval's own listing: the voices were missing only while
        # the eval ran with its models loaded (#960).
        if: always() && (github.event_name != 'schedule' || steps.guard.outputs.run != 'false')
        continue-on-error: true
        run: |
          echo "say -v ? lines: $(say -v '?' | wc -l)"
          echo "Samantha/Daniel/Thomas lines: $(say -v '?' | grep -c -E '^(Samantha|Daniel|Thomas)')"

      - name: Name the STT service's state
        # A stalled eval reads the same whether the reaper stopped the server
        # or another process held port 8000 (#829).
        if: failure() && steps.eval.outcome == 'failure'
        run: |
          {
            echo '```'
            ./scripts/mac/lv-test-servers.sh diagnose speechd
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Scoreboard to step summary
        # Extract the section between the scoreboard markers (kept in sync
        # with AgentDictationE2EEvalSupport.scoreboardBeginMarker/EndMarker).
        # `always() &&` keeps the scoreboard on eval failure but stays quiet
        # on a guard-skipped nightly ("no eval log produced" would read as a
        # failure there). Same on the two steps below.
        if: always() && (github.event_name != 'schedule' || steps.guard.outputs.run != 'false')
        run: |
          if [[ -f logs/eval-e2e.log ]]; then
            {
              echo '```'
              awk '/^== agent-dictation E2E eval scoreboard ==/{flag=1} flag{print} /^== end agent-dictation E2E eval scoreboard ==/{flag=0}' logs/eval-e2e.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no eval log produced" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload eval log (scoreboard artifact)
        if: always() && (github.event_name != 'schedule' || steps.guard.outputs.run != 'false')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-e2e-scoreboard
          path: logs/eval-e2e.log
          retention-days: 30

      - name: Process leak check (informational)
        if: always() && (github.event_name != 'schedule' || steps.guard.outputs.run != 'false')
        run: |
          survivors="$(ps -axo pid,etime,ucomm \
            | grep -iE 'localvoxtral|polishd|xctest|swiftpm-testing|XCBBuildService' \
            | grep -v grep || true)"
          if [[ -n "$survivors" ]]; then
            echo "candidate processes still alive at job end:"
            echo "$survivors"
          else
            echo "no candidate processes alive at job end"
          fi
