name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-test:
    # Same-repo branches run on the self-hosted Mac (persistent workspace, warm
    # incremental builds). Fork PRs run on GitHub-hosted macOS so untrusted code
    # never executes on the build machine.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "macOS", "ARM64"]') || 'macos-latest' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        if: runner.environment == 'github-hosted'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Cache SwiftPM build
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Build
        run: swift build

      - name: Test (unit suite)
        # The two integration suites need a live inference backend and are
        # exercised manually; see CLAUDE.md.
        run: |
          swift test \
            --skip RealtimeAPIVLLMIntegrationTests \
            --skip MlxAudioTranscriptionIntegrationTests

      - name: Integration tests (live voxmlx)
        # The self-hosted runner has voxmlx serving locally (launchd service
        # com.localvoxtral.voxmlx). On GitHub-hosted runners there is no
        # backend and the suite self-skips, so this step is self-hosted only.
        if: runner.environment == 'self-hosted'
        env:
          VLLM_REALTIME_TEST_ENABLE: "1"
          VLLM_REALTIME_TEST_MODEL: T0mSIlver/Voxtral-Mini-4B-Realtime-2602-MLX-4bit
        run: swift test --filter RealtimeAPIVLLMIntegrationTests

      - name: Package app bundle
        run: ./scripts/package_app.sh release

      - name: Zip app for artifact upload
        # upload-artifact mangles symlinks/exec bits in .app bundles; ditto-zip
        # first so the downloaded app keeps a valid signature.
        run: ditto -c -k --sequesterRsrc --keepParent dist/localvoxtral.app dist/localvoxtral-app.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: localvoxtral-app
          path: dist/localvoxtral-app.zip
          retention-days: 7

      - name: Smoke test packaged app launch
        run: |
          python3 - <<'PY'
          import subprocess
          import time

          app_binary = "dist/localvoxtral.app/Contents/MacOS/localvoxtral"
          process = subprocess.Popen([app_binary])
          time.sleep(2)

          exit_code = process.poll()
          if exit_code is not None:
            raise SystemExit(f"packaged app exited during smoke test: {exit_code}")

          process.terminate()
          try:
            process.wait(timeout=5)
          except subprocess.TimeoutExpired:
            process.kill()
            process.wait(timeout=5)
          PY
