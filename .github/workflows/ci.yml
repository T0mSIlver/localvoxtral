name: CI

on:
  pull_request:
    # The defaults plus `ready_for_review`: mac-lanes skips a draft (see its
    # `if:`), so marking a PR ready has to start the run that was skipped.
    # `converted_to_draft` so that a PR pulled back to draft replaces its
    # queued or running Mac job (same concurrency group) with a skipped one.
    # NOT `edited`: a body edit would start a run whose skipped jobs become
    # the newest check runs on that head, and a skipped required check counts
    # as passing, so an edit could turn a red head green.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  # Manual dispatch exists to produce artifacts on demand — today that means
  # the opt-in dogfood build (scripts/try-pr.sh --dogfood offers to trigger
  # one). The dispatched ref already had its own push/PR run, so the
  # conditional live-model lanes skip on dispatch (see the lane decide steps).
  # The live herdr lane is the exception — a dispatch is how that external
  # contract gets repeated — so it defaults ON and is opted out per dispatch
  # with `herdr=false`.
  workflow_dispatch:
    inputs:
      dogfood:
        description: "Also package the dogfood-instrumented app (artifact: localvoxtral-app-dogfood)"
        type: boolean
        default: false
      herdr:
        description: "Run the live herdr lane on this dispatch"
        type: boolean
        default: true
      # REDUNDANT since build-test moved to hosted runners for every event
      # (this PR): the job it used to redirect is now always on macos-latest,
      # so this input has no effect on anything. Kept for one release so a
      # scripted `gh workflow run CI -f hosted=true` does not start failing on
      # an unknown input; delete it once nothing passes it. It cannot be
      # repurposed to move mac-lanes — that job exists precisely because its
      # work needs THAT Mac.
      hosted:
        description: "No-op since build-test always runs on GitHub-hosted macOS. Retained for compatibility."
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # TIER 0 — GitHub-hosted macOS, for every event and every contributor.
  #
  # This is the required status check on main, and it is deliberately the
  # portable half of CI: shell tests, format lint, the unit suite, coverage.
  # It runs on hosted runners for SAME-REPO PRs too (owner decision
  # 2026-09-05, "option 1"), which is what took tier 0 off the owner's
  # personal MacBook — the single self-hosted runner was 89 % busy during a
  # four-agent burst and 3.4 h of work produced 8.95 h of queue. Hosted
  # runners are free for public repositories and start in seconds; the
  # measured hosted lane (run 33981779091) executed the identical 2769 test
  # cases in the same wall-clock a warm Mac run took, with an 8 s queue.
  #
  # A fork PR gets ONLY this job (mac-lanes refuses to run untrusted code on
  # the owner's machine), so on a fork PR it also packages, uploads and
  # launch-smokes an ad-hoc-signed bundle — the coverage a fork would
  # otherwise lose. For same-repo runs mac-lanes does that with the real
  # signing identity, so those steps are skipped here rather than duplicated.
  build-test:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # Step-level `if:` can read `env`; job-level `if:` cannot. Computed once
      # here so every fork-only step reads the same expression.
      IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags so package_app.sh can git-describe the
          # artifact version (shallow clones can't, and fall back to 0.0.0-dev).
          fetch-depth: 0
          # No `clean: false` here: hosted runners are ephemeral, so there
          # is no warm .build to preserve and nothing a previous run left
          # behind. The persistent-workspace machinery lives in mac-lanes.

      - name: Decide CI fast path
        id: ci_scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
          # env indirection, not inline ${{ }} in the script body: PR bodies
          # and commit messages are attacker-shaped strings (same discipline as
          # the lane-decide steps below).
          PR_BODY: ${{ github.event.pull_request.body }}
          PUSH_HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          FILES="$RUNNER_TEMP/ci-fast-path-changed-files.txt"

          full_run() {
            local reason="$1"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "CI fast path: full run ($reason)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          # Both runner types use the same job. Fetch the event's exact diff
          # endpoints explicitly: the persistent checkout uses clean: false,
          # and checkout/history behavior must never be trusted as a skip gate.
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            if [[ -z "$PR_BASE_SHA" ]] \
                || ! git fetch --no-tags origin "$PR_BASE_SHA" \
                || ! git cat-file -e "$PR_BASE_SHA^{commit}" 2>/dev/null; then
              full_run "PR base unavailable — failing open"
            fi
            BASE="$PR_BASE_SHA"
            TARGET="HEAD"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ -z "$PUSH_BEFORE_SHA" || "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
              full_run "push before SHA is empty/all-zero — failing open"
            fi
            if [[ -z "$PUSH_AFTER_SHA" ]] \
                || ! git fetch --no-tags origin "$PUSH_AFTER_SHA" \
                || ! git cat-file -e "$PUSH_AFTER_SHA^{commit}" 2>/dev/null; then
              full_run "push after SHA unavailable — failing open"
            fi
            if ! git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null \
                && ! git fetch --no-tags origin "$PUSH_BEFORE_SHA"; then
              full_run "push before SHA unavailable — failing open"
            fi
            if ! git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
              full_run "push before SHA is not a commit — failing open"
            fi
            BASE="$PUSH_BEFORE_SHA"
            TARGET="$PUSH_AFTER_SHA"
          else
            full_run "unsupported event $GITHUB_EVENT_NAME — failing open"
          fi

          if ! git diff --name-only "$BASE" "$TARGET" -- > "$FILES"; then
            full_run "changed-file diff failed — failing open"
          fi
          # The explicit lane markers are an opt-in contract (docs/agent/test-tiers.md "When
          # must the LLM lanes run?"): they must keep working even when the
          # diff itself is docs-only, so they force the full path BEFORE the
          # filter can decide otherwise.
          MARKER_TEXT="${PR_BODY}"$'\n'"${PUSH_HEAD_MESSAGE}"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && -n "$PR_HEAD_SHA" ]]; then
            # On PRs, head_commit.message is empty and HEAD is the synthetic
            # merge commit. The marker contract includes the PR's real head
            # commit message (the lane decide steps below read it), so this
            # fast-path escape hatch must read it too — otherwise a marker
            # carried only by the head commit of a docs-only diff would be
            # skipped straight past the lane it asked for.
            MARKER_TEXT+=$'\n'"$(git log -1 --format=%B "$PR_HEAD_SHA" 2>/dev/null || true)"
          fi
          if grep -qF '[run-llm-eval]' <<<"$MARKER_TEXT" \
              || grep -qF '[run-speechd-integration]' <<<"$MARKER_TEXT" \
              || grep -qF '[run-herdr-integration]' <<<"$MARKER_TEXT" \
              || grep -qF '[run-stt-integration]' <<<"$MARKER_TEXT" \
              || grep -qF '[mac-lanes]' <<<"$MARKER_TEXT" \
              || grep -qF '[dogfood-package]' <<<"$MARKER_TEXT"; then
            full_run "explicit lane marker present in PR body / head commit"
          fi

          if ! DECISION="$(./scripts/ci/docs-only-filter.sh "$FILES")"; then
            full_run "docs-only filter failed — failing open"
          fi

          DOCS_ONLY="$(sed -n 's/^docs_only=//p' <<<"$DECISION")"
          COUNT="$(sed -n 's/^count=//p' <<<"$DECISION")"
          REASON="$(sed -n 's/^reason=//p' <<<"$DECISION")"
          if [[ "$DOCS_ONLY" != "true" && "$DOCS_ONLY" != "false" ]] \
              || [[ ! "$COUNT" =~ ^[0-9]+$ ]] || [[ -z "$REASON" ]]; then
            full_run "docs-only filter returned an ambiguous decision — failing open"
          fi

          echo "$DECISION" >> "$GITHUB_OUTPUT"
          if [[ "$DOCS_ONLY" == "true" ]]; then
            echo "CI fast path: docs/scripts-only diff — Swift lanes skipped ($COUNT changed file(s))" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "CI fast path: full run ($REASON)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Process-cleanup regression tests
        # Pure shell tests for the workspace selector, the SSH build gate's
        # TERM -> KILL process-group teardown, and the SSH UI gate's allowlist /
        # lock refusal / window-ownership rules. Pure shell against PATH stubs,
        # so it needs no Mac and no GUI — which is why it belongs here rather
        # than on the runner whose gates it is testing.
        # Deliberately NOT gated on the docs-only fast path: the gate scripts
        # are fast-path-eligible, so these tests are what still exercises a
        # gate-only diff. That also makes them the bulk of a fast-path run.
        #
        # Not cheap, and no longer dominated by one thing: test-ui-gate.sh was
        # ~80 s of the ~95 s here (measured 2026-09-05) because FOUR of its
        # ~360 assertions drove the gate's wall-clock waits to their deadline
        # while its `sleep` stub turned each poll into a fork storm. Those
        # budgets are seams now and the suite sets them short. What is left is
        # ~360 fresh `bash` processes, so keep this to ONE copy — a duplicated
        # pair of these steps went unnoticed for six weeks (#255) — and think
        # before adding another gate suite that re-execs a script per
        # assertion.
        #
        # Two things keep it short (#418). The suites run at the same time
        # (scripts/ci/run-shell-suites.sh), so the step costs what its slowest
        # one costs. And test-ui-gate.sh, about 60 % of the serial total, runs
        # on a PR only when the diff touches a file it reads
        # (scripts/ci/ui-gate-suite-filter.sh); every push to main and every
        # dispatch runs it. The changed-file list is the fast-path step's, and
        # a missing one fails open.
        run: |
          set -euo pipefail
          UI_GATE_SUITE=""
          DECISION="$(./scripts/ci/ui-gate-suite-filter.sh \
            "$RUNNER_TEMP/ci-fast-path-changed-files.txt" "$GITHUB_EVENT_NAME")"
          REASON="$(sed -n 's/^reason=//p' <<<"$DECISION")"
          if [[ "$(sed -n 's/^run=//p' <<<"$DECISION")" == "true" ]]; then
            UI_GATE_SUITE="./scripts/ci/test-ui-gate.sh"
            echo "UI gate suite: RUNNING ($REASON)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "UI gate suite: SKIPPED ($REASON)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # $UI_GATE_SUITE unquoted on purpose: empty means no argument.
          ./scripts/ci/run-shell-suites.sh $UI_GATE_SUITE \
            ./scripts/ci/test-cleanup-stale-test-processes.sh \
            ./scripts/ci/test-build-gate-process-cleanup.sh \
            ./scripts/ci/test-build-gate-reap-command.sh \
            ./scripts/ci/test-build-gate-gc-command.sh \
            ./scripts/ci/test-remote-build-reap.sh \
            ./scripts/ci/test-remote-build-gc.sh \
            ./scripts/ci/test-remote-build-gate-args.sh \
            ./scripts/ci/test-remote-build-shards.sh \
            ./scripts/ci/test-run-supervised-command.sh \
            ./scripts/ci/test-ui-smoke-guard.sh \
            ./scripts/ci/test-ui-smoke-owner-app.sh \
            ./scripts/ci/test-runner-node-resign.sh \
            ./scripts/ci/test-launch-app-shim.sh \
            ./scripts/ci/test-word-accuracy.sh \
            ./scripts/ci/test-e2e-dictation-preconditions.sh \
            ./scripts/ci/test-ac-power-guard.sh \
            ./scripts/ci/test-llm-lane-filter.sh \
            ./scripts/ci/test-herdr-lane-filter.sh \
            ./scripts/ci/test-helper-lane-filter.sh \
            ./scripts/ci/test-stt-lane-filter.sh \
            ./scripts/ci/test-herdr-fixture-recovery.sh \
            ./scripts/ci/test-clean-stale-outputs.sh \
            ./scripts/ci/test-workflow-step-names.sh \
            ./scripts/ci/test-agents-guide-budget.sh \
            ./scripts/ci/test-resolve-release-notes.sh \
            ./scripts/ci/test-nightly-version.sh \
            ./scripts/ci/test-prune-nightly-releases.sh \
            ./scripts/ci/test-render-cask.sh \
            ./scripts/ci/test-restore-mtimes.sh \
            ./scripts/ci/test-watch-checks.sh \
            ./scripts/ci/test-ui-gate-suite-filter.sh \
            ./scripts/ci/test-unit-test-shards.sh

      - name: Record hosted toolchain
        id: hosted_toolchain
        if: steps.ci_scope.outputs.docs_only != 'true'
        run: |
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"
          swift --version | tee -a "$GITHUB_STEP_SUMMARY"
          # Cache-key component: a .build tree produced by one toolchain must
          # never be restored into a build running under another.
          SLUG="$(swift --version | head -1 | tr -cs 'a-zA-Z0-9.' '-' | cut -c1-48)"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM build cache
        id: build_cache
        if: steps.ci_scope.outputs.docs_only != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          # Keyed on the toolchain as well as Package.resolved: the old key
          # (and its bare `swiftpm-macOS-` restore prefix) would happily
          # restore a swift.org-6.2.1-built .build into an Xcode build.
          #
          # The commit SHA is the last component so that every push to main
          # SAVES a fresh entry (below) and a PR restores the newest main
          # build through the prefix. The single-key `actions/cache` step
          # this replaces saved only on a miss, so one entry from weeks ago
          # served every run and each run had to rebuild what had changed
          # since — on top of rebuilding everything else, see the next step.
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.hosted_toolchain.outputs.slug }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.hosted_toolchain.outputs.slug }}-${{ hashFiles('Package.resolved') }}-
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.hosted_toolchain.outputs.slug }}-

      - name: Restore tracked-file mtimes from git
        # Without this the cache above is dead weight: a fresh checkout stamps
        # every file with the checkout time, swift-driver compares each
        # source's mtime with the one recorded in the cached build, and every
        # file of every target recompiles — 437 "Compiling" lines right after
        # "Cache restored successfully" (run 35708695284, 2026-09-22), about
        # 150 s of the 242 s unit-test step. Commit times are the same on
        # every checkout, so with them restored an unchanged file matches its
        # record and only what a newer commit touched rebuilds. The matched
        # key ends in the main commit the cache was saved from; every file
        # whose content differs from that commit is touched to now, so two
        # branches committing one file in the same second cannot share an
        # mtime the driver would take for "unchanged" (the script explains).
        if: steps.ci_scope.outputs.docs_only != 'true'
        env:
          MATCHED_KEY: ${{ steps.build_cache.outputs.cache-matched-key }}
        run: |
          CACHE_BASE=""
          if [[ "$MATCHED_KEY" =~ -([0-9a-f]{40})$ ]]; then
            CACHE_BASE="${BASH_REMATCH[1]}"
          fi
          ./scripts/ci/restore-mtimes.sh . "$CACHE_BASE"

      - name: Installer asset-resolution regression test (issue #131)
        # Pure bash against a stubbed curl — no network, sub-second.
        run: ./scripts/ci/test-install-resolve.sh

      - name: Format lint (advisory)
        # Advisory until the one-shot tree reformat lands: swift-format exits 0
        # on findings without --strict. After the reformat, add --strict here
        # to make style regressions block.
        if: steps.ci_scope.outputs.docs_only != 'true'
        run: |
          swift format lint --recursive --parallel Sources Tests Package.swift 2>&1 \
            | tee format-lint.txt | tail -n 5
          echo "format-lint findings: $(wc -l < format-lint.txt | tr -d ' ')"

      - name: Test (unit suite)
        # The integration suite needs a live inference backend and is exercised
        # manually; see CLAUDE.md. This is also the job's compile gate: the
        # old standalone `swift build` step built plain-debug products that
        # nothing downstream consumed (tests rebuild with coverage flags,
        # packaging builds release), so it was pure duplicate compilation.
        if: steps.ci_scope.outputs.docs_only != 'true'
        run: |
          # AgentDictationE2EEvalTests is skipped explicitly (belt) on top of
          # the marker cleanup above (suspenders): it is the nightly
          # eval-e2e.yml lane, never tier 0, and a leftover enable marker must
          # not turn the unit step into a many-minute live-inference run.
          #
          # 900 s flat. This step used to pick 300 s on the self-hosted runner
          # and 900 s on hosted; it now only ever runs hosted, where the build
          # is cold (~70 s) and the machine is a 3-core shared VM, so the
          # generous bound is the right one. The point of the supervisor is
          # forensics on a HANG (it samples the wedged xctest before killing
          # it), not a tight performance budget.
          #
          # NSUnbufferedIO: xctest's stdout is a pipe here, so without it the
          # runner block-buffers and the log stops at a buffer boundary, up to
          # several KB (dozens of test cases) BEFORE the test that hung. Four
          # hosted hangs "always right after PolishModelCatalogTests" were
          # that boundary, not that suite. Xcode sets the same variable for
          # its own test runs.
          #
          # One xctest process per core, each running whole test classes
          # (scripts/lib/unit-test-shards.sh, #442): the same shape as
          # `remote-build.sh test`, and one complete log.
          NSUnbufferedIO=YES ./scripts/ci/run-supervised-command.sh \
            900 "$RUNNER_TEMP/localvoxtral-unit-tests.log" -- \
            ./scripts/ci/run-unit-shards.sh --coverage "$(sysctl -n hw.ncpu)" \
            RealtimeAPIVLLMIntegrationTests \
            SpeechHelperIntegrationTests \
            AgentDictationE2EEvalTests \
            HerdrIntegrationTests \
            PolishContextPreparationTests

      - name: Upload complete unit-test log
        if: ${{ always() && steps.ci_scope.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-log-${{ runner.os }}
          path: ${{ runner.temp }}/localvoxtral-unit-tests.log
          if-no-files-found: error
          retention-days: 7

      - name: Save SwiftPM build cache
        # Main only: a PR restores main's newest entry through the restore
        # prefix, and saving per PR push would evict main's entries from the
        # repository's 10 GB cache. `always()` because a red test run still
        # leaves a complete build worth reusing.
        if: ${{ always() && github.ref == 'refs/heads/main' && steps.ci_scope.outputs.docs_only != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.hosted_toolchain.outputs.slug }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}

      - name: Coverage summary
        # Visibility, not a gate: lets a PR's Proof section cite real coverage
        # of the changed files instead of "a test exists".
        #
        # BEFORE the cost-budget step, not after it: SwiftPM writes the profile
        # to one fixed path under .build/debug/codecov, so the second `swift
        # test` of the job overwrites the first's counters. Read here, this
        # reports the unit suite; read after the cost budgets it would silently
        # report their 16 filtered cases instead, and nothing would go red.
        if: steps.ci_scope.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          BIN="$(find .build -type f -name localvoxtralPackageTests -path '*.xctest/Contents/MacOS/*' | head -n 1)"
          PROF="$(find .build -type f -name default.profdata -path '*debug*' | head -n 1)"
          if [[ -z "$BIN" || -z "$PROF" ]]; then
            echo "coverage data not found under .build"; exit 1
          fi
          xcrun llvm-cov report "$BIN" -instr-profile "$PROF" \
            -ignore-filename-regex '(Tests|\.build)/'

      - name: Test (cost budgets)
        # PolishContextPreparationTests measures how much work a preparation
        # costs, so its cases are slow ON PURPOSE and cannot be made faster
        # without deleting what they assert (#430). It stays a required part of
        # this job and runs on every non-docs event; it is only out of the unit
        # suite so that that lane stays inner-loop speed.
        # Same --enable-code-coverage as the unit suite, so this reuses the
        # binary that step built instead of relinking the whole test bundle.
        if: steps.ci_scope.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          NSUnbufferedIO=YES ./scripts/ci/run-supervised-command.sh \
            300 "$RUNNER_TEMP/localvoxtral-cost-budget-tests.log" -- \
            swift test \
            --filter PolishContextPreparationTests \
            --enable-code-coverage
          # A --filter that matches nothing runs zero tests and exits 0, so a
          # renamed or split suite would leave this required step green and
          # empty while the unit step's --skip quietly stopped skipping
          # anything. The log is complete (NSUnbufferedIO=YES above), so the
          # suite has to appear in it by name.
          if ! grep -q "Test Suite 'PolishContextPreparationTests'" \
            "$RUNNER_TEMP/localvoxtral-cost-budget-tests.log"; then
            echo "PolishContextPreparationTests ran no cases: the --filter here and the --skip in the unit step must name the suite as it is spelled now" >&2
            exit 1
          fi

      - name: Upload complete cost-budget-test log
        # Not `error` on a missing file: the step that writes it is skipped
        # when the unit suite above fails, and the job is already red then.
        if: ${{ always() && steps.ci_scope.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cost-budget-test-log-${{ runner.os }}
          path: ${{ runner.temp }}/localvoxtral-cost-budget-tests.log
          if-no-files-found: warn
          retention-days: 7

      - name: Package app bundle
        # FORK PRs ONLY. A fork gets no mac-lanes job, so this is the only
        # place its change is packaged, launch-smoked and turned into a
        # downloadable artifact — without it a fork would lose that coverage
        # entirely. Same-repo runs skip it because mac-lanes packages with the
        # real localvoxtral-dev identity a few minutes later, and building the
        # bundle twice per run would be pure waste.
        #
        # Ad-hoc signature and no MLX helpers, both unavoidable here: the
        # signing cert lives in the owner's keychain, and a hosted runner has
        # no MetalToolchain component (a cold MLX C++ build would dominate
        # fork-PR CI anyway). The helpers' real Metal build is a mac-lanes job.
        if: steps.ci_scope.outputs.docs_only != 'true' && env.IS_FORK_PR == 'true'
        env:
          LOCALVOXTRAL_CODESIGN_IDENTITY: localvoxtral-dev
          LOCALVOXTRAL_SKIP_POLISHD: "1"
          LOCALVOXTRAL_SKIP_SPEECHD: "1"
          # Self-hosted lanes (same-repo PRs, main) MUST ship an identity-signed
          # bundle so try-pr.sh leaves the signature untouched and the owner's
          # Accessibility (TCC) grant survives across builds. Fail the build
          # loudly rather than silently upload an ad-hoc artifact if the runner
          # user's keychain has lost the cert. Hosted fork-PR runners have no
          # cert and are expected to be ad-hoc, so the requirement is off there.
          LOCALVOXTRAL_REQUIRE_CODESIGN_IDENTITY: "0"
        run: ./scripts/package_app.sh release

      - name: Zip app for artifact upload
        # upload-artifact mangles symlinks/exec bits in .app bundles; ditto-zip
        # first so the downloaded app keeps a valid signature.
        if: steps.ci_scope.outputs.docs_only != 'true' && env.IS_FORK_PR == 'true'
        run: ditto -c -k --sequesterRsrc --keepParent dist/localvoxtral.app dist/localvoxtral-app.zip

      - name: Upload app artifact
        if: steps.ci_scope.outputs.docs_only != 'true' && env.IS_FORK_PR == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: localvoxtral-app
          path: dist/localvoxtral-app.zip
          retention-days: 7

      - name: Zip dSYM for artifact upload
        # Includes helper dSYMs when present (self-hosted lanes) — helper
        # crashes (MLX C++/Metal) are the likeliest field
        # crashes, and a dSYM that never leaves the runner symbolizes nothing.
        if: steps.ci_scope.outputs.docs_only != 'true' && env.IS_FORK_PR == 'true'
        run: |
          ditto -c -k --keepParent dist/localvoxtral.dSYM dist/localvoxtral-dSYM.zip
          if [[ -d dist/localvoxtral-polishd.dSYM ]]; then
            ditto -c -k --keepParent dist/localvoxtral-polishd.dSYM dist/localvoxtral-polishd-dSYM.zip
          fi
          if [[ -d dist/localvoxtral-speechd.dSYM ]]; then
            ditto -c -k --keepParent dist/localvoxtral-speechd.dSYM dist/localvoxtral-speechd-dSYM.zip
          fi

      - name: Upload dSYM artifact
        # Longer retention than the app: field crashes surface days after the
        # try-pr build that produced them.
        if: steps.ci_scope.outputs.docs_only != 'true' && env.IS_FORK_PR == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: localvoxtral-dsym
          path: |
            dist/localvoxtral-dSYM.zip
            dist/localvoxtral-polishd-dSYM.zip
            dist/localvoxtral-speechd-dSYM.zip
          retention-days: 30

      - name: Smoke test packaged app launch (end-user simulation)
        if: steps.ci_scope.outputs.docs_only != 'true' && env.IS_FORK_PR == 'true'
        env:
          # TCC attributes the launched app's permission checks to the
          # runner's bundled node (the service's responsible process). A
          # runner auto-update swaps that node and invalidates its
          # Accessibility grant, so the app's startup prompt pops a REAL
          # dialog on the runner's GUI session on every run (2026-07-24).
          # Suppress only the startup prompts; the launch path stays
          # production-shaped.
          LOCALVOXTRAL_SUPPRESS_STARTUP_PERMISSION_PROMPTS: "1"
        run: |
          # Launch a COPY of the packaged app from outside the workspace with
          # the workspace .build renamed away. A same-tree launch silently
          # passes even when the binary's resource lookup depends on the
          # builder's absolute .build path (SwiftPM's generated Bundle.module
          # accessor falls back to it) — which crashes at launch on every
          # OTHER machine. That masking shipped launch-broken artifacts (#87).
          SMOKE_DIR="$(mktemp -d)"
          ditto dist/localvoxtral.app "$SMOKE_DIR/localvoxtral.app"
          mv .build .build.smoke-hidden
          trap 'mv .build.smoke-hidden .build' EXIT
          SMOKE_APP="$SMOKE_DIR/localvoxtral.app" python3 - <<'PY'
          import os
          import subprocess
          import time

          app_binary = os.environ["SMOKE_APP"] + "/Contents/MacOS/localvoxtral"
          process = subprocess.Popen([app_binary])
          time.sleep(2)

          exit_code = process.poll()
          if exit_code is not None:
            raise SystemExit(f"packaged app exited during smoke test: {exit_code}")

          process.terminate()
          try:
            process.wait(timeout=5)
          except subprocess.TimeoutExpired:
            process.kill()
            process.wait(timeout=5)
          PY

  # EVERYTHING THAT NEEDS THIS PARTICULAR MAC, and nothing else.
  #
  # The owner's personal MacBook holds the things a hosted runner cannot
  # supply: the stable `localvoxtral-dev` signing identity (an ad-hoc
  # signature would invalidate the owner's Accessibility grant on every
  # try-pr.sh install), the launch-on-demand speechd STT service and the
  # multi-GB model weights the live lanes need, a real Metal toolchain for
  # the two MLX helpers, the herdr/sshd fixture, and the GUI session the
  # UI-gate artifact root lives in.
  #
  # Runs in PARALLEL with build-test, not after it: they share no artifact,
  # and each computes the fast-path decision itself (a sub-second step)
  # rather than serialising behind a `needs:`.
  #
  # NEVER runs for a fork PR — the whole point of the split above.
  #
  # Skips a DRAFT PR. This Mac runs one job at a time, and a PR branch gets a
  # median of 2 and a p90 of 4 runs before it merges (#418), so every push of
  # work in progress was a slot taken from a PR that was waiting to merge.
  # build-test still runs on every push of a draft. A skipped job satisfies
  # the required check, which is safe for one reason: GitHub does not merge a
  # draft, and marking it ready fires `ready_for_review`, which runs this job
  # on the current head. A draft that needs the signed artifact (try-pr.sh) or
  # a live lane carries the literal [mac-lanes] in its PR BODY. The body and
  # not the commit message, because a job-level `if:` sees only the event.
  mac-lanes:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       (!github.event.pull_request.draft || contains(github.event.pull_request.body, '[mac-lanes]')))
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags so package_app.sh can git-describe the
          # artifact version (shallow clones can't, and fall back to 0.0.0-dev).
          fetch-depth: 0
          # Keep gitignored build state between runs on the persistent
          # self-hosted runner. The default `git clean -ffdx` wiped .build/ and
          # PolishHelper/.build/ and SpeechHelper/.build/ (including helper xcodebuild
          # DerivedData) at the start of EVERY run, forcing a cold MLX C++ +
          # Metal rebuild twice per run — ~4.5 min of a ~7.5 min job. Releases
          # keep the pristine-tree guarantee (release.yml checks out with the
          # default clean), and hosted fork-PR runners are ephemeral, so this
          # only affects same-repo CI. If the runner's incremental state ever
          # corrupts (e.g. a stale SwiftPM lock from a killed run), one-time
          # fix: `git clean -ffdx` in the runner's _work/localvoxtral tree.
          clean: false

      - name: Decide CI fast path
        id: ci_scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
          # env indirection, not inline ${{ }} in the script body: PR bodies
          # and commit messages are attacker-shaped strings (same discipline as
          # the lane-decide steps below).
          PR_BODY: ${{ github.event.pull_request.body }}
          PUSH_HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          FILES="$RUNNER_TEMP/ci-fast-path-changed-files.txt"

          full_run() {
            local reason="$1"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "CI fast path: full run ($reason)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          # Both runner types use the same job. Fetch the event's exact diff
          # endpoints explicitly: the persistent checkout uses clean: false,
          # and checkout/history behavior must never be trusted as a skip gate.
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            if [[ -z "$PR_BASE_SHA" ]] \
                || ! git fetch --no-tags origin "$PR_BASE_SHA" \
                || ! git cat-file -e "$PR_BASE_SHA^{commit}" 2>/dev/null; then
              full_run "PR base unavailable — failing open"
            fi
            BASE="$PR_BASE_SHA"
            TARGET="HEAD"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ -z "$PUSH_BEFORE_SHA" || "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
              full_run "push before SHA is empty/all-zero — failing open"
            fi
            if [[ -z "$PUSH_AFTER_SHA" ]] \
                || ! git fetch --no-tags origin "$PUSH_AFTER_SHA" \
                || ! git cat-file -e "$PUSH_AFTER_SHA^{commit}" 2>/dev/null; then
              full_run "push after SHA unavailable — failing open"
            fi
            if ! git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null \
                && ! git fetch --no-tags origin "$PUSH_BEFORE_SHA"; then
              full_run "push before SHA unavailable — failing open"
            fi
            if ! git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
              full_run "push before SHA is not a commit — failing open"
            fi
            BASE="$PUSH_BEFORE_SHA"
            TARGET="$PUSH_AFTER_SHA"
          else
            full_run "unsupported event $GITHUB_EVENT_NAME — failing open"
          fi

          if ! git diff --name-only "$BASE" "$TARGET" -- > "$FILES"; then
            full_run "changed-file diff failed — failing open"
          fi
          # The explicit lane markers are an opt-in contract (docs/agent/test-tiers.md "When
          # must the LLM lanes run?"): they must keep working even when the
          # diff itself is docs-only, so they force the full path BEFORE the
          # filter can decide otherwise.
          MARKER_TEXT="${PR_BODY}"$'\n'"${PUSH_HEAD_MESSAGE}"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && -n "$PR_HEAD_SHA" ]]; then
            # On PRs, head_commit.message is empty and HEAD is the synthetic
            # merge commit. The marker contract includes the PR's real head
            # commit message (the lane decide steps below read it), so this
            # fast-path escape hatch must read it too — otherwise a marker
            # carried only by the head commit of a docs-only diff would be
            # skipped straight past the lane it asked for.
            MARKER_TEXT+=$'\n'"$(git log -1 --format=%B "$PR_HEAD_SHA" 2>/dev/null || true)"
          fi
          if grep -qF '[run-llm-eval]' <<<"$MARKER_TEXT" \
              || grep -qF '[run-speechd-integration]' <<<"$MARKER_TEXT" \
              || grep -qF '[run-herdr-integration]' <<<"$MARKER_TEXT" \
              || grep -qF '[run-stt-integration]' <<<"$MARKER_TEXT" \
              || grep -qF '[mac-lanes]' <<<"$MARKER_TEXT" \
              || grep -qF '[dogfood-package]' <<<"$MARKER_TEXT"; then
            full_run "explicit lane marker present in PR body / head commit"
          fi

          if ! DECISION="$(./scripts/ci/docs-only-filter.sh "$FILES")"; then
            full_run "docs-only filter failed — failing open"
          fi

          DOCS_ONLY="$(sed -n 's/^docs_only=//p' <<<"$DECISION")"
          COUNT="$(sed -n 's/^count=//p' <<<"$DECISION")"
          REASON="$(sed -n 's/^reason=//p' <<<"$DECISION")"
          if [[ "$DOCS_ONLY" != "true" && "$DOCS_ONLY" != "false" ]] \
              || [[ ! "$COUNT" =~ ^[0-9]+$ ]] || [[ -z "$REASON" ]]; then
            full_run "docs-only filter returned an ambiguous decision — failing open"
          fi

          echo "$DECISION" >> "$GITHUB_OUTPUT"
          if [[ "$DOCS_ONLY" == "true" ]]; then
            echo "CI fast path: docs/scripts-only diff — Swift lanes skipped ($COUNT changed file(s))" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "CI fast path: full run ($REASON)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Clean stale outputs (keep build caches)
        # clean: false above skips git clean entirely, so outputs a previous
        # run generated must be removed by hand — but NOT the build caches.
        # Shared with ui-smoke.yml/eval-e2e.yml (same persistent workspace);
        # the removal list and the .build.smoke-hidden repair rationale live
        # in the script.
        run: ./scripts/ci/clean-stale-outputs.sh

      - name: Clean abandoned test processes in this workspace
        # A cancelled self-hosted job can outlive the Actions process cookie
        # and leave swift-package/xctest running in this persistent checkout.
        # Scope by current user + lsof cwd/mapped text; never pkill globally
        # because the owner and parallel worktrees may run legitimate tests.
        run: ./scripts/ci/cleanup-stale-test-processes.sh "$GITHUB_WORKSPACE"

      - name: Decide LLM eval lane (path filter + [run-llm-eval] marker)
        # CI must not pay ~8 min of 4B weight-loading + live inference on
        # every push: the polishd live-model integration step below runs only
        # when the diff touches LLM-relevant paths, or when the PR body /
        # head commit message contains the literal marker [run-llm-eval].
        # The path list and the matching logic live in
        # scripts/ci/llm-lane-filter.sh (kept out of the workflow so it is
        # testable locally); the human-judgment rule is docs/agent/test-tiers.md
        # "When must the LLM lanes run?". The PolishHelper UNIT suite and the
        # tier-1 speechd realtime integration stay per-push.
        id: llm_lane
        if: steps.ci_scope.outputs.docs_only != 'true'
        env:
          # env indirection, not inline ${{ }} in the script body: PR bodies
          # and commit messages are attacker-shaped strings.
          PR_BODY: ${{ github.event.pull_request.body }}
          PUSH_HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # Manual dispatch exists to (re)produce artifacts (try-pr.sh
            # --dogfood). The dispatched ref's own push/PR run already made
            # this lane's diff-based decision; don't reload 4B weights here.
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "LLM eval lane: SKIPPED (manual dispatch — decided by the ref's own push/PR run)" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          FILES="$RUNNER_TEMP/llm-lane-changed-files.txt"
          MARKER_TEXT="$RUNNER_TEMP/llm-lane-marker-text.txt"

          # Changed files against the merge base. fetch-depth: 0 above means
          # full history is present; clean: false does not affect refs.
          BASE=""
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BASE="$(git merge-base "origin/$BASE_REF" HEAD || true)"
          else
            # push to main: the previous tip, unless history was rewritten
            # or this is the first push (all-zero sha / unknown object).
            if git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
              BASE="$PUSH_BEFORE_SHA"
            fi
          fi
          if [[ -z "$BASE" ]]; then
            # Fail open: an uncomputable diff must never skip a gate.
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "LLM eval lane: RUNNING (diff unavailable — failing open)" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --name-only "$BASE" HEAD > "$FILES"

          # Marker sources: PR body + PR head commit message, or (on push)
          # the head commit message. On PRs HEAD is the synthetic merge
          # commit, so read the message from the real head sha.
          printf '%s\n' "$PR_BODY" > "$MARKER_TEXT"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git log -1 --format=%B "$PR_HEAD_SHA" >> "$MARKER_TEXT" || true
          else
            printf '%s\n' "$PUSH_HEAD_MESSAGE" >> "$MARKER_TEXT"
          fi

          DECISION="$(./scripts/ci/llm-lane-filter.sh "$FILES" "$MARKER_TEXT")"
          echo "$DECISION" >> "$GITHUB_OUTPUT"
          REASON="$(sed -n 's/^reason=//p' <<<"$DECISION")"
          if [[ "$(sed -n 's/^run=//p' <<<"$DECISION")" == "true" ]]; then
            echo "LLM eval lane: RUNNING ($REASON)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "LLM eval lane: SKIPPED ($REASON)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Decide speechd integration lane (path filter + [run-speechd-integration] marker)
        # Real speechd inference loads the multi-GB Voxtral model on the
        # personal-Mac runner, so keep it conditional just like polishd.
        id: speechd_lane
        if: steps.ci_scope.outputs.docs_only != 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PUSH_HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # Same rationale as the LLM lane above: dispatch produces
            # artifacts; the ref's own push/PR run decided this lane.
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Speechd integration lane: SKIPPED (manual dispatch — decided by the ref's own push/PR run)" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          FILES="$RUNNER_TEMP/speechd-lane-changed-files.txt"
          MARKER_TEXT="$RUNNER_TEMP/speechd-lane-marker-text.txt"

          BASE=""
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BASE="$(git merge-base "origin/$BASE_REF" HEAD || true)"
          elif git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
            BASE="$PUSH_BEFORE_SHA"
          fi
          if [[ -z "$BASE" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Speechd integration lane: RUNNING (diff unavailable — failing open)" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --name-only "$BASE" HEAD > "$FILES"

          printf '%s\n' "$PR_BODY" > "$MARKER_TEXT"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git log -1 --format=%B "$PR_HEAD_SHA" >> "$MARKER_TEXT" || true
          else
            printf '%s\n' "$PUSH_HEAD_MESSAGE" >> "$MARKER_TEXT"
          fi

          DECISION="$(./scripts/ci/speechd-lane-filter.sh "$FILES" "$MARKER_TEXT")"
          echo "$DECISION" >> "$GITHUB_OUTPUT"
          REASON="$(sed -n 's/^reason=//p' <<<"$DECISION")"
          if [[ "$(sed -n 's/^run=//p' <<<"$DECISION")" == "true" ]]; then
            echo "Speechd integration lane: RUNNING ($REASON)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Speechd integration lane: SKIPPED ($REASON)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Decide herdr integration lane (path filter + [run-herdr-integration] marker)
        # The lane starts a real herdr server, a real loopback sshd, and real
        # herdr clients on ptys (on their own socket and config/state homes,
        # beside any herdr this account runs), and it borrows ~/.ssh/config
        # blocks for the duration of the run. Conditional
        # for the same reason the model lanes are: it must run when the diff
        # can change what we say to herdr or believe it said, and stay out of
        # the way otherwise. Path list: scripts/ci/herdr-lane-filter.sh.
        id: herdr_lane
        if: steps.ci_scope.outputs.docs_only != 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PUSH_HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          DISPATCH_HERDR: ${{ inputs.herdr }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # A dispatch is the repetition mechanism for this live external
            # contract. Unlike the model lanes, it needs no downloaded model
            # and is expected to be run several times while investigating
            # runner-only behavior — so it stays ON by default here.
            #
            # `herdr=false` opts a single dispatch out. The dispatch that
            # exists to produce an ARTIFACT (scripts/try-pr.sh --dogfood)
            # passes it, because that dispatch never asked for this lane's
            # time or its failure modes. Pushes and PRs are untouched by
            # this input — they keep the path filter + [run-herdr-integration]
            # marker, which is what holds the contract.
            if [[ "$DISPATCH_HERDR" == "false" ]]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Herdr integration lane: SKIPPED (manual dispatch with herdr=false)" \
                | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "Herdr integration lane: RUNNING (manual dispatch)" \
                | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          FILES="$RUNNER_TEMP/herdr-lane-changed-files.txt"
          MARKER_TEXT="$RUNNER_TEMP/herdr-lane-marker-text.txt"

          BASE=""
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BASE="$(git merge-base "origin/$BASE_REF" HEAD || true)"
          elif git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
            BASE="$PUSH_BEFORE_SHA"
          fi
          if [[ -z "$BASE" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Herdr integration lane: RUNNING (diff unavailable — failing open)" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --name-only "$BASE" HEAD > "$FILES"

          printf '%s\n' "$PR_BODY" > "$MARKER_TEXT"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git log -1 --format=%B "$PR_HEAD_SHA" >> "$MARKER_TEXT" || true
          else
            printf '%s\n' "$PUSH_HEAD_MESSAGE" >> "$MARKER_TEXT"
          fi

          DECISION="$(./scripts/ci/herdr-lane-filter.sh "$FILES" "$MARKER_TEXT")"
          echo "$DECISION" >> "$GITHUB_OUTPUT"
          REASON="$(sed -n 's/^reason=//p' <<<"$DECISION")"
          if [[ "$(sed -n 's/^run=//p' <<<"$DECISION")" == "true" ]]; then
            echo "Herdr integration lane: RUNNING ($REASON)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Herdr integration lane: SKIPPED ($REASON)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Decide dogfood artifact lane ([dogfood-package] marker / dispatch input)
        # The instrumented (LOCALVOXTRAL_DOGFOOD) app is packaged and uploaded
        # only on explicit opt-in: the literal marker [dogfood-package] in the
        # PR body / head commit message, or the workflow_dispatch `dogfood`
        # input (which is what scripts/try-pr.sh --dogfood offers to trigger).
        # Opt-in because the second packaging pass recompiles the root app
        # under the extra define — and flips the incremental cache, so the
        # NEXT clean run recompiles it back. No path filter: dogfooding is a
        # human decision, not a diff property.
        id: dogfood_lane
        if: steps.ci_scope.outputs.docs_only != 'true'
        env:
          # env indirection, not inline ${{ }} in the script body: PR bodies
          # and commit messages are attacker-shaped strings.
          PR_BODY: ${{ github.event.pull_request.body }}
          PUSH_HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DISPATCH_DOGFOOD: ${{ inputs.dogfood }}
        run: |
          set -euo pipefail
          RUN=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$DISPATCH_DOGFOOD" == "true" ]]; then
              RUN=true; REASON="workflow_dispatch with dogfood=true"
            else
              REASON="workflow_dispatch without dogfood=true"
            fi
          else
            # Marker sources mirror the LLM lane: PR body + PR head commit
            # message (HEAD is the synthetic merge commit on PRs), or the
            # head commit message on push.
            MARKER_TEXT="$RUNNER_TEMP/dogfood-lane-marker-text.txt"
            printf '%s\n' "$PR_BODY" > "$MARKER_TEXT"
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              git log -1 --format=%B "$PR_HEAD_SHA" >> "$MARKER_TEXT" || true
            else
              printf '%s\n' "$PUSH_HEAD_MESSAGE" >> "$MARKER_TEXT"
            fi
            if grep -qF '[dogfood-package]' "$MARKER_TEXT"; then
              RUN=true; REASON="[dogfood-package] marker present"
            else
              REASON="no [dogfood-package] marker in PR body / head commit message"
            fi
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          if [[ "$RUN" == "true" ]]; then
            echo "Dogfood artifact lane: RUNNING ($REASON)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Dogfood artifact lane: SKIPPED ($REASON)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Decide helper unit lanes (path filter)
        # The two helper UNIT suites (11 s + 20 s) ran on every self-hosted run,
        # including diffs that could not change what they test. Both helpers are
        # HERMETIC SwiftPM packages — only remote dependencies, no `path:` dep,
        # no `..`, no symlink out, no source shared with the root package — so a
        # suite's only inputs are its own directory (Package.swift and
        # Package.resolved included) plus the CI plumbing that invokes it. The
        # path list and the event rules live in scripts/ci/helper-lane-filter.sh
        # so they are testable locally (scripts/ci/test-helper-lane-filter.sh).
        #
        # Unlike the live-model lanes this is not an "expensive, so opt in"
        # gate and there is NO marker: a diff that can affect a suite runs it.
        # workflow_dispatch and push-to-main run both unconditionally (the
        # filter decides that, not this step), so a dispatch is the escape
        # hatch and main stays the ungated parity reference.
        id: helper_lanes
        if: steps.ci_scope.outputs.docs_only != 'true'
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          # env indirection, not inline ${{ }} in the script body: PR bodies
          # and commit messages are attacker-shaped strings.
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          FILES="$RUNNER_TEMP/helper-lane-changed-files.txt"

          BASE=""
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BASE="$(git merge-base "origin/$BASE_REF" HEAD || true)"
          elif git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
            BASE="$PUSH_BEFORE_SHA"
          fi
          if [[ -z "$BASE" ]]; then
            # Fail open: an uncomputable diff must never skip a suite. Same
            # contract as every other lane-decide step here.
            : >"$FILES"
            echo "polish_run=true" >> "$GITHUB_OUTPUT"
            echo "speech_run=true" >> "$GITHUB_OUTPUT"
            echo "stt_run=true" >> "$GITHUB_OUTPUT"
            echo "Live STT lane: RUNNING (diff unavailable — failing open)" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "PolishHelper unit lane: RUNNING (diff unavailable — failing open)" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "SpeechHelper unit lane: RUNNING (diff unavailable — failing open)" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --name-only "$BASE" HEAD > "$FILES"

          decide() {
            local helper="$1" label="$2" output_key="$3" decision run reason
            decision="$(./scripts/ci/helper-lane-filter.sh "$helper" "$FILES" "$GITHUB_EVENT_NAME")"
            run="$(sed -n 's/^run=//p' <<<"$decision")"
            reason="$(sed -n 's/^reason=//p' <<<"$decision")"
            echo "$output_key=$run" >> "$GITHUB_OUTPUT"
            if [[ "$run" == "true" ]]; then
              echo "$label unit lane: RUNNING ($reason)" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "$label unit lane: SKIPPED ($reason)" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          }
          decide polish PolishHelper polish_run
          decide speech SpeechHelper speech_run

          # The live STT integration, decided here because this step already
          # holds the diff. Its rules and why the lane can be gated at all are
          # in scripts/ci/stt-lane-filter.sh.
          STT_MARKER_TEXT="$RUNNER_TEMP/stt-lane-marker-text.txt"
          printf '%s\n' "$PR_BODY" > "$STT_MARKER_TEXT"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && -n "$PR_HEAD_SHA" ]]; then
            git log -1 --format=%B "$PR_HEAD_SHA" >> "$STT_MARKER_TEXT" 2>/dev/null || true
          fi
          stt_decision="$(./scripts/ci/stt-lane-filter.sh "$FILES" "$GITHUB_EVENT_NAME" "$STT_MARKER_TEXT")"
          stt_run="$(sed -n 's/^run=//p' <<<"$stt_decision")"
          stt_reason="$(sed -n 's/^reason=//p' <<<"$stt_decision")"
          echo "stt_run=$stt_run" >> "$GITHUB_OUTPUT"
          if [[ "$stt_run" == "true" ]]; then
            echo "Live STT lane: RUNNING ($stt_reason)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Live STT lane: SKIPPED ($stt_reason)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # No "Setup Swift" step here on purpose. A prior `swift-actions/setup-swift@v2`
      # step (floating swift-version: "6.2") pinned the swift.org toolchain,
      # which now resolves to 6.2.1 — built with assertions ON, and it asserts
      # (signal 6) lowering this app's `@MainActor deinit` (isolated destructor,
      # DictationViewModel.swift) to SIL. The self-hosted lane never hit this:
      # it always builds with the Mac's Xcode toolchain, which ships
      # assertions OFF. Fork PRs (the only jobs that land here — see the
      # runs-on expression above) now build with the hosted runner image's
      # Xcode toolchain too, matching the self-hosted lane's toolchain *kind*
      # instead of diverging onto swift.org's. Which Xcode that is comes from
      # the active developer directory (xcode-select / DEVELOPER_DIR), not
      # PATH, and the image's default floats the same way the swift-version
      # did — so the step below records it, both for the log and for the cache
      # key. A toolchain that is too old fails loudly at compile time; the
      # package needs swift-tools-version 6.2 to parse the manifest at all.

      - name: Warm on-demand speechd server
        # The build host's speechd STT test service is launch-on-demand (its
        # multi-GB weights are not resident 24/7 — scripts/mac/lv-test-servers.sh).
        # Touch its trigger and block until port 8000 is healthy so the
        # integration suite below hits warm weights; this also resets the idle
        # window, so a burst of CI runs reuses one warm process and the reaper
        # frees the RAM only after the machine goes quiet. This service is the
        # reason the live-STT lane cannot leave this machine.
        #
        # The `ensure speechd` name works whether the host still runs the retired
        # Python voxmlx plist or the swapped-in Swift speechd plist: both are
        # triggered through the same run-dir path and answer a TCP probe on 8000.
        #
        # Best-effort during rollout: the on-demand LaunchAgents + run dir are a
        # one-time owner install (scripts/mac/README.md). Until that's done the
        # run dir is absent and there is nothing to warm — the still-resident
        # STT service serves the suite, so skip cleanly instead of failing CI.
        # The integration step below is the real gate on the STT service.
        if: steps.ci_scope.outputs.docs_only != 'true' && steps.helper_lanes.outputs.stt_run == 'true'
        run: |
          if [ -d /Users/Shared/localvoxtral/run ]; then
            ./scripts/mac/lv-test-servers.sh ensure speechd
          else
            echo "on-demand infra not installed (run dir absent) — relying on the" \
                 "resident STT service; see scripts/mac/README.md to enable on-demand."
          fi

      - name: Integration tests (live STT service)
        # The self-hosted runner has the STT test service serving locally
        # (launchd service com.localvoxtral.testspeechd, warmed on-demand by the
        # step above). Nowhere else has that backend, which is why this lane
        # stayed behind when tier 0 moved to hosted runners.
        # Path-gated by the decide step above (scripts/ci/stt-lane-filter.sh):
        # every PR whose diff the lane can see, every push to main, every
        # dispatch.
        if: steps.ci_scope.outputs.docs_only != 'true' && steps.helper_lanes.outputs.stt_run == 'true'
        env:
          VLLM_REALTIME_TEST_ENABLE: "1"
          VLLM_REALTIME_TEST_MODEL: T0mSIlver/Voxtral-Mini-4B-Realtime-2602-4bit-qhead
        # --enable-code-coverage matches the unit step's build flags exactly:
        # without it SwiftPM treats the coverage-instrumented products as
        # stale and recompiles the whole app+test module a second time
        # (~12 s per run for zero information).
        run: swift test --filter RealtimeAPIVLLMIntegrationTests --enable-code-coverage

      - name: Polishing helper unit tests (PolishHelper package)
        # Metal-free (HTTP layer, router, cache locator, watchdog); the Metal
        # path is the packaging step below. Kept on the Mac rather than moved
        # to build-test because a hosted runner would pay a cold Cmlx C++
        # compile for it on every single run, warm here via clean: false.
        # Path-gated by the decide step above — see its comment for why that
        # is sound and scripts/ci/helper-lane-filter.sh for the rules.
        if: steps.ci_scope.outputs.docs_only != 'true' && steps.helper_lanes.outputs.polish_run == 'true'
        run: swift test --package-path PolishHelper

      - name: Speech helper unit tests (SpeechHelper package)
        # Matching PolishHelper: the Metal-free codec/delta/watchdog suite,
        # kept here for the same warm-Cmlx reason. Real Metal inference is the
        # conditional post-packaging lane below.
        # Path-gated by the decide step above — see its comment for why that
        # is sound and scripts/ci/helper-lane-filter.sh for the rules.
        if: steps.ci_scope.outputs.docs_only != 'true' && steps.helper_lanes.outputs.speech_run == 'true'
        run: swift test --package-path SpeechHelper

      - name: Dogfood capture suite (instrumented build)
        # The dogfooding capture is behind a COMPILE flag (Package.swift), so
        # neither it nor its tests exist in any of the lanes above — the normal
        # unit suite compiles the shipping shape, which is the point. Without
        # this step the capture would rot silently: nothing else in CI ever
        # builds it, and it is only ever exercised by hand.
        #
        # Kept on the Mac, matching the helper suites: it is a second full
        # compile of the app target, which a cold hosted runner would pay
        # from scratch.
        #
        # Its OWN scratch path, never the shared .build. The define changes
        # what the app and test modules contain, and SwiftPM did not recompile
        # the test objects when the define went away again: with `clean:
        # false` the next run's first Swift step on this workspace linked the
        # previous run's dogfood-only `DogfoodControlProtocolTests.swift.o`
        # against a non-dogfood app module and died with undefined symbols
        # (runs 34146743103 and 34147271131, 2026-09-07). Two caches cost disk,
        # not correctness; one cache cost every Mac lane.
        if: steps.ci_scope.outputs.docs_only != 'true'
        env:
          LOCALVOXTRAL_DOGFOOD: "1"
        run: swift test --filter 'Dogfood' --scratch-path .build-dogfood

      - name: Ensure Metal toolchain
        # Xcode 26 ships the Metal compiler as a separate component, and its
        # activation is per-user — installing it for the SSH build user does
        # not activate it for the runner user. Probe with a real invocation
        # (`xcrun --find metal` succeeds even when the component is missing)
        # and self-provision loudly; the asset is cached system-wide, so a
        # re-activation here is quick.
        if: steps.ci_scope.outputs.docs_only != 'true'
        run: |
          if ! xcrun metal --version >/dev/null 2>&1; then
            echo "Metal toolchain not active for $(whoami); installing component..."
            # The MobileAsset catalog fetch fails transiently (observed for
            # both the builder and runner users on 2026-07-07) — retry.
            for attempt in 1 2 3; do
              xcodebuild -downloadComponent MetalToolchain && break
              echo "catalog fetch failed (attempt $attempt); retrying in 10s..."
              sleep 10
            done
            xcrun metal --version
          fi

      - name: Package app bundle
        # THE SIGNED bundle, and the reason this job cannot move: the runner's
        # keychain holds the stable localvoxtral-dev cert, which is what keeps
        # the owner's Accessibility (TCC) grant valid across try-pr.sh installs.
        # An ad-hoc signature would break it on every build. Both bundled MLX
        # helpers are built here for real (Metal kernels via xcodebuild).
        if: steps.ci_scope.outputs.docs_only != 'true'
        env:
          LOCALVOXTRAL_CODESIGN_IDENTITY: localvoxtral-dev
          LOCALVOXTRAL_SKIP_POLISHD: "0"
          LOCALVOXTRAL_SKIP_SPEECHD: "0"
          # Self-hosted lanes (same-repo PRs, main) MUST ship an identity-signed
          # bundle so try-pr.sh leaves the signature untouched and the owner's
          # Accessibility (TCC) grant survives across builds. Fail the build
          # loudly rather than silently upload an ad-hoc artifact if the runner
          # user's keychain has lost the cert. Hosted fork-PR runners have no
          # cert and are expected to be ad-hoc, so the requirement is off there.
          LOCALVOXTRAL_REQUIRE_CODESIGN_IDENTITY: "1"
        run: ./scripts/package_app.sh release

      - name: Zip app for artifact upload
        # upload-artifact mangles symlinks/exec bits in .app bundles; ditto-zip
        # first so the downloaded app keeps a valid signature.
        if: steps.ci_scope.outputs.docs_only != 'true'
        run: ditto -c -k --sequesterRsrc --keepParent dist/localvoxtral.app dist/localvoxtral-app.zip

      - name: Upload app artifact
        if: steps.ci_scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: localvoxtral-app
          path: dist/localvoxtral-app.zip
          retention-days: 7

      - name: Zip dSYM for artifact upload
        # Includes helper dSYMs when present (self-hosted lanes) — helper
        # crashes (MLX C++/Metal) are the likeliest field
        # crashes, and a dSYM that never leaves the runner symbolizes nothing.
        if: steps.ci_scope.outputs.docs_only != 'true'
        run: |
          ditto -c -k --keepParent dist/localvoxtral.dSYM dist/localvoxtral-dSYM.zip
          if [[ -d dist/localvoxtral-polishd.dSYM ]]; then
            ditto -c -k --keepParent dist/localvoxtral-polishd.dSYM dist/localvoxtral-polishd-dSYM.zip
          fi
          if [[ -d dist/localvoxtral-speechd.dSYM ]]; then
            ditto -c -k --keepParent dist/localvoxtral-speechd.dSYM dist/localvoxtral-speechd-dSYM.zip
          fi

      - name: Upload dSYM artifact
        # Longer retention than the app: field crashes surface days after the
        # try-pr build that produced them.
        if: steps.ci_scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: localvoxtral-dsym
          path: |
            dist/localvoxtral-dSYM.zip
            dist/localvoxtral-polishd-dSYM.zip
            dist/localvoxtral-speechd-dSYM.zip
          retention-days: 30

      - name: Smoke test packaged app launch (end-user simulation)
        if: steps.ci_scope.outputs.docs_only != 'true'
        env:
          # TCC attributes the launched app's permission checks to the
          # runner's bundled node (the service's responsible process). A
          # runner auto-update swaps that node and invalidates its
          # Accessibility grant, so the app's startup prompt pops a REAL
          # dialog on the runner's GUI session on every run (2026-07-24).
          # Suppress only the startup prompts; the launch path stays
          # production-shaped.
          LOCALVOXTRAL_SUPPRESS_STARTUP_PERMISSION_PROMPTS: "1"
        run: |
          # Launch a COPY of the packaged app from outside the workspace with
          # the workspace .build renamed away. A same-tree launch silently
          # passes even when the binary's resource lookup depends on the
          # builder's absolute .build path (SwiftPM's generated Bundle.module
          # accessor falls back to it) — which crashes at launch on every
          # OTHER machine. That masking shipped launch-broken artifacts (#87).
          SMOKE_DIR="$(mktemp -d)"
          ditto dist/localvoxtral.app "$SMOKE_DIR/localvoxtral.app"
          mv .build .build.smoke-hidden
          trap 'mv .build.smoke-hidden .build' EXIT
          SMOKE_APP="$SMOKE_DIR/localvoxtral.app" python3 - <<'PY'
          import os
          import subprocess
          import time

          app_binary = os.environ["SMOKE_APP"] + "/Contents/MacOS/localvoxtral"
          process = subprocess.Popen([app_binary])
          time.sleep(2)

          exit_code = process.poll()
          if exit_code is not None:
            raise SystemExit(f"packaged app exited during smoke test: {exit_code}")

          process.terminate()
          try:
            process.wait(timeout=5)
          except subprocess.TimeoutExpired:
            process.kill()
            process.wait(timeout=5)
          PY

      - name: Package dogfood app bundle (opt-in instrumented artifact)
        # Second packaging pass with the dogfood capture COMPILE flag. Fetch
        # and launch with `scripts/try-pr.sh <pr|main> --dogfood`.
        # - Enablement is the step env, NEVER the .dogfood-capture-enable
        #   marker file: this workspace is persistent (clean: false), and a
        #   marker file surviving a cancelled run would silently instrument
        #   every later build. A step env cannot leak.
        # - Runs AFTER the launch smoke so the smoke exercises the artifact
        #   end users get, and the clean dist/localvoxtral.app is already
        #   zipped and uploaded before this pass overwrites dist/. The helper
        #   xcodebuild lanes are incremental no-ops; only the root app
        #   recompiles under the define.
        # - Runs BEFORE the conditional live lanes, so no live precondition
        #   can cost a dispatch the artifact it was dispatched for. See the
        #   phase comment below.
        # - Same bundle id and signing identity as the clean build, so the
        #   designated requirement — and the owner's Accessibility (TCC)
        #   grant — is identical when switching between the two.
        # - package_app.sh self-verifies the LVXDogfoodCapture Info.plist
        #   stamp and fails loudly on mismatch; no re-check needed here.
        if: steps.ci_scope.outputs.docs_only != 'true' && steps.dogfood_lane.outputs.run == 'true'
        env:
          LOCALVOXTRAL_CODESIGN_IDENTITY: localvoxtral-dev
          LOCALVOXTRAL_REQUIRE_CODESIGN_IDENTITY: "1"
          LOCALVOXTRAL_DOGFOOD: "1"
        run: |
          ./scripts/package_app.sh release
          ditto -c -k --sequesterRsrc --keepParent dist/localvoxtral.app dist/localvoxtral-app-dogfood.zip
          # The instrumented root binary has its own UUID, so the clean
          # localvoxtral-dsym artifact can't symbolicate a crash that happens
          # while hand-dogfooding — ship this pass's dSYM too. The helper
          # dSYMs are unchanged by this pass (incremental xcodebuild no-ops)
          # and already ship in localvoxtral-dsym.
          ditto -c -k --keepParent dist/localvoxtral.dSYM dist/localvoxtral-dsym-dogfood.zip

      - name: Upload dogfood app artifact
        if: steps.ci_scope.outputs.docs_only != 'true' && steps.dogfood_lane.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: localvoxtral-app-dogfood
          path: dist/localvoxtral-app-dogfood.zip
          retention-days: 7

      - name: Upload dogfood dSYM artifact
        # Same longer retention rationale as localvoxtral-dsym: field crashes
        # surface days after the build that produced them.
        if: steps.ci_scope.outputs.docs_only != 'true' && steps.dogfood_lane.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: localvoxtral-dsym-dogfood
          path: dist/localvoxtral-dsym-dogfood.zip
          retention-days: 30

      - name: Install the dogfood build into the UI gate's artifact root
        # An agent driving the SSH UI gate can BUILD but cannot INSTALL: there
        # is no gate verb that runs try-pr.sh and no shell on that account. The
        # runner closes that gap for free — it is a launchd agent in the
        # owner's GUI session, so $HOME here IS the GUI account's home (proved
        # by the workspace path, /Users/tom/actions-runner/...), which is where
        # the gate's default artifact root lives. Dispatching a build is then
        # the install, with no hand-copying and no new gate verb.
        #
        # workflow_dispatch + dogfood=true ONLY, deliberately narrower than the
        # dogfood lane itself: the [dogfood-package] marker fires on ordinary
        # PR pushes, and no PR run should write into the owner's home. The
        # install destination is what moves here; the gate's roots are
        # untouched and stay owner-writable only.
        #
        # `github.event.inputs.dogfood`, not `inputs.dogfood`: the input is
        # declared `type: boolean`, and comparing a boolean to the string
        # 'true' in an expression coerces both to numbers (1 vs NaN) and is
        # therefore always false — a gate that silently never fires. The event
        # payload's copy is a string, so it compares as written.
        # `runner.environment == 'self-hosted'` is redundant now that this
        # whole job is self-hosted, and it stays on purpose: this is the one
        # step that writes into the OWNER'S HOME. A guard that costs nothing
        # and would catch someone moving the step to the wrong job is worth
        # keeping, and scripts/ci/test-ui-gate.sh asserts it by name.
        if: >-
          runner.environment == 'self-hosted'
          && github.event_name == 'workflow_dispatch'
          && github.event.inputs.dogfood == 'true'
          && steps.dogfood_lane.outputs.run == 'true'
        run: |
          set -uo pipefail
          # dist/localvoxtral.app is the instrumented bundle at this point (the
          # dogfood pass overwrote it); install-ui-artifact.sh reads the
          # LVXDogfoodCapture stamp and picks the dogfood slot accordingly.
          STATUS=0
          INSTALLED="$(./scripts/mac/install-ui-artifact.sh dist/localvoxtral.app --no-hint \
            --label "${GITHUB_REF_NAME} @ ${GITHUB_SHA:0:7} (run ${GITHUB_RUN_ID})")" || STATUS=$?
          if (( STATUS == 3 )); then
            # Exit 3 is the one refusal that is not a build problem: that slot
            # is running, which only the operator can resolve.
            echo "::warning::UI-gate install skipped — the target bundle is running. Quit it (ssh lv-ui 'quit') and re-dispatch."
            echo "UI-gate install skipped: the target bundle is running." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if (( STATUS != 0 )); then
            echo "::error::UI-gate install failed (exit $STATUS)."
            exit "$STATUS"
          fi
          GATE_ARG="${INSTALLED#"$HOME"/}"
          {
            echo "### Installed for the UI gate"
            echo
            echo '```'
            echo "ssh lv-ui 'launch --dogfood $GATE_ARG'"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # ---- CONDITIONAL LIVE LANES --------------------------------------
      # Artifact production is finished above; below this line are the lanes
      # that hold a contract against something live and are opted into per
      # run (weights on disk, a real herdr server + loopback sshd). They come
      # last because a lane's precondition must never cost the run the
      # artifacts it was dispatched to produce: the herdr lane used to sit
      # before packaging, and while its fixture refused to start beside the
      # herdr the owner runs all day (before #323), `-f dogfood=true` could not reach the
      # packaging steps on the owner's Mac at all (run 35084386041).
      # New conditional live lanes go here, below the artifact steps.
      #
      # dist/localvoxtral.app is the INSTRUMENTED bundle here when the dogfood
      # lane ran. That is fine for the speechd lane below: package_app.sh
      # copies the same SpeechHelper xcodebuild Release product in both passes
      # (the LOCALVOXTRAL_DOGFOOD define only reaches the root app binary and
      # the Info.plist stamp — grep DOGFOOD in scripts/package_app.sh).
      - name: Speech helper integration (real audio + live model)
        # Runs packaged speechd through RealtimeAPIWebSocketClient with the
        # tier-1 spoken fixture. Conditional because it loads the multi-GB
        # Voxtral model. Local equivalent: remote-build.sh integration-speechd.
        if: steps.ci_scope.outputs.docs_only != 'true' && steps.speechd_lane.outputs.run == 'true'
        env:
          SPEECHD_INTEGRATION_TEST_ENABLE: "1"
          SPEECHD_INTEGRATION_TEST_PATH: dist/localvoxtral.app/Contents/MacOS/localvoxtral-speechd
        # --enable-code-coverage matches the unit step's build flags (same
        # rationale as the STT integration step above): without it this step rebuilds
        # the whole app+test module without coverage (~17 s), and the next
        # run's unit step rebuilds it back again.
        run: swift test --filter SpeechHelperIntegrationTests --enable-code-coverage

      - name: Polishing helper integration (live model + eval baseline)
        # Spawns the helper built by the packaging step with the real pinned
        # model, drives the production polish request path, and asserts the
        # shared eval baseline + parent-pid tether. Conditional — this is the
        # step that loads 4B weights and runs live inference; the decide step
        # above (path filter + [run-llm-eval] marker) says whether this
        # change can affect what the lane measures. Local equivalent:
        # ./scripts/remote-build.sh integration-polishd
        if: steps.ci_scope.outputs.docs_only != 'true' && steps.llm_lane.outputs.run == 'true'
        env:
          LOCALVOXTRAL_POLISHD_TEST_ENABLE: "1"
          LOCALVOXTRAL_POLISHD_TEST_PATH: PolishHelper/.build/xcode/Build/Products/Release/localvoxtral-polishd
        # --enable-code-coverage: same flag-matching rationale as the speechd
        # step above.
        run: swift test --filter PolishHelperIntegrationTests --enable-code-coverage

      - name: Live herdr integration (real server + real ssh -L forward)
        # Drives the remote-herdr join machinery against a live herdr server
        # over a forward the app's own coordinator opens, and pins the
        # EXTERNAL herdr assumptions the surface-authorization argument rests
        # on (docs/agent/remote-herdr-panel-binding.md). Self-hosted only, and
        # not because of cost: the fixture provisions a loopback sshd and
        # appends blocks to the account's ~/.ssh/config, which a hosted fork-PR runner
        # must never be asked to do. Local equivalent:
        # ./scripts/remote-build.sh integration-herdr
        if: steps.ci_scope.outputs.docs_only != 'true' && steps.herdr_lane.outputs.run == 'true'
        env:
          HERDR_INTEGRATION_TEST_ENABLE: "1"
          HERDR_INTEGRATION_DIAGNOSTICS_DIR: ${{ runner.temp }}/herdr-lane-diagnostics
        # --enable-code-coverage matches the unit step's build flags (same
        # rationale as the STT integration step above).
        # Load flake hint (measured 2026-09-07: one concurrent swift build
        # fails ~1 run in 10 on a clear-visibility race, with socket p99
        # unchanged): if this step is red, suspect overlapping worker builds
        # on the Mac first and re-run the lane alone before debugging.
        run: >-
          swift test --filter HerdrIntegrationTests --enable-code-coverage || {
          echo 'HERDR-LANE-HINT: red lane? check for overlapping worker builds
          (remote-build.sh) on the Mac and re-run this lane alone first —
          see docs/agent/test-tiers.md "Worker builds on the Mac must not
          overlap the lane".'; exit 1; }

      - name: Upload herdr lane diagnostics
        if: always() && steps.ci_scope.outputs.docs_only != 'true' && steps.herdr_lane.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: herdr-lane-diagnostics
          path: ${{ runner.temp }}/herdr-lane-diagnostics
          if-no-files-found: warn

      - name: Process leak check (informational)
        # ~15% of runs spend ~105 s in the runner's post-job "Cleaning up
        # orphan processes" phase, and the Worker logs don't name what it
        # reaps. Snapshot candidate survivors at job end so any future
        # occurrence identifies itself. UID/state distinguish another account
        # and harmless zombies; names stay ucomm-only (no paths or arguments)
        # because this log is public. Informational — never fails the job.
        if: always()
        run: |
          survivors="$(ps -axo pid,uid,etime,state,ucomm \
            | grep -iE 'localvoxtral|polishd|speechd|xctest|swiftpm-testing|XCBBuildService' \
            | grep -v grep || true)"
          if [[ -n "$survivors" ]]; then
            echo "candidate processes still alive at job end:"
            echo "$survivors"
          else
            echo "no candidate processes alive at job end"
          fi
