# >>> localvoxtral remote >>>
# Dictation context for localvoxtral on another machine, over the ssh tunnel
# its enrollment set up. Managed from that Mac's Settings → Remote hosts; edits
# inside this block are replaced on update. `2>/dev/null || :` keeps a missing
# script from showing as a hook failure on every turn.
[[hooks]]
name = "localvoxtral-remote-files"
type = "post_tool"
match = "re:^(read_file|write_file|edit|file_system[.](read_file|write_file|search_replace))$"
command = "sh \"$HOME/.vibe/localvoxtral/remote/post.sh\" 2>/dev/null || :"
timeout = 5.0
description = "Tell localvoxtral which files this session touched."

[[hooks]]
name = "localvoxtral-remote-turn"
type = "post_agent"
command = "sh \"$HOME/.vibe/localvoxtral/remote/post.sh\" 2>/dev/null || :"
timeout = 5.0
description = "Tell localvoxtral a turn ended, with the prompt that started it."
# <<< localvoxtral remote <<<
