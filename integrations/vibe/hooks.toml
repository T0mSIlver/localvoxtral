# >>> localvoxtral >>>
# Dictation context for localvoxtral. Managed from Settings → Mistral Vibe;
# edits inside this block are replaced on update.
[[hooks]]
name = "localvoxtral-files"
type = "post_tool"
match = "re:^(read_file|write_file|edit)$"
command = "sh \"$HOME/.vibe/localvoxtral/publish.sh\""
timeout = 5.0
description = "Tell localvoxtral which files this session touched."

[[hooks]]
name = "localvoxtral-turn"
type = "post_agent"
command = "sh \"$HOME/.vibe/localvoxtral/publish.sh\""
timeout = 5.0
description = "Tell localvoxtral a turn ended, with the prompt that started it."
# <<< localvoxtral <<<
